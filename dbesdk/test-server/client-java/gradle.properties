# Versions for the single generated Java Test_Client (Requirement 1.6).
#
# smithy-java reached general availability at 1.x; 1.4.0 is the current stable
# release on Maven Central (verified against
# repo1.maven.org/.../software/amazon/smithy/java/client-rpcv2-cbor). The Smithy
# Gradle plugin (smithy-base) is versioned independently and is also at 1.4.0.
#
# smithyProtocolTraitsVersion matches the pin used by the model's own
# smithy-build.json (task 1) so the rpcv2Cbor protocol trait resolves identically
# during code generation.
smithyGradleVersion=1.4.0
smithyJavaVersion=1.4.0
smithyProtocolTraitsVersion=1.58.0

# Run the Smithy CLI in a forked process to isolate its classloader from Gradle.
org.gradle.jvmargs=-Xmx2g
