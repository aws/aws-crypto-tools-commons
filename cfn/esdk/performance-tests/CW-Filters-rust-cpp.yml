AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  CloudWatch metric filters for the ESDK C++ shim (rust-cpp) hierarchical-keyring
  performance benchmarks published to CloudWatch Logs by aws-crypto-tools-rust.

Parameters:
  LogGroupName:
    Type: String
    Default: aws-esdk-performance-benchmarks
    Description: Log group the benchmark workflow publishes to.

Resources:
  RustCppHierarchicalConcurrent50MBP50:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalConcurrency50MBP50
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "concurrent" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalConcurrentP50Latency
          MetricValue: $.result.p50_latency
          Unit: Milliseconds

  RustCppHierarchicalConcurrent50MBP95:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalConcurrency50MBP95
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "concurrent" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalConcurrentP95Latency
          MetricValue: $.result.p95_latency
          Unit: Milliseconds

  RustCppHierarchicalConcurrent50MBP99:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalConcurrency50MBP99
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "concurrent" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalConcurrentP99Latency
          MetricValue: $.result.p99_latency
          Unit: Milliseconds

  RustCppHierarchicalThroughput50MBP50:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalThroughput50MBP50
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "throughput" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalThroughputP50Latency
          MetricValue: $.result.p50_latency
          Unit: Milliseconds

  RustCppHierarchicalThroughput50MBP95:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalThroughput50MBP95
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "throughput" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalThroughputP95Latency
          MetricValue: $.result.p95_latency
          Unit: Milliseconds

  RustCppHierarchicalThroughput50MBP99:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalThroughput50MBP99
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "throughput" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalThroughputP99Latency
          MetricValue: $.result.p99_latency
          Unit: Milliseconds

  RustCppHierarchicalMemoryUsage50MB:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalMemoryUsage50MB
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "memory" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalPeakMemoryUsage
          MetricValue: $.result.peak_memory_mb
          Unit: Megabytes

  RustCppHierarchicalMemoryEfficiency50MB:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterName: NativeRustCppHierarchicalMemoryEfficiency50MB
      LogGroupName: !Ref LogGroupName
      FilterPattern: '{ $.result.language = "rust-cpp" && $.metadata.keyring = "hierarchical" && $.result.test_name = "memory" && $.result.data_size = 52428800 }'
      MetricTransformations:
        - MetricNamespace: RustCppPerformanceBenchmarks
          MetricName: HierarchicalMemoryEfficiencyRatio
          MetricValue: $.result.memory_efficiency_ratio
          # Payload bytes per byte of peak memory delta.
          Unit: None
