# CodeBuild-hosted GitHub Actions runners for the Crypto Tools repositories.
#
# Creates three reserved-capacity fleets (Linux, macOS, Windows), one runner
# project per repository and fleet (each project registers its own repository
# webhook), and a CloudWatch dashboard of runner usage.
#
# Each fleet has a fixed number of instances. The Linux and Windows fleets
# overflow to on-demand compute; CodeBuild has no on-demand macOS compute, so
# macOS jobs beyond the fleet's capacity queue.
#
# Prerequisite: connect CodeBuild to GitHub once per account and region
# (CodeBuild console > Settings > Source providers > GitHub), as a GitHub user
# who is admin on every listed repository. The runner projects use that
# account-level credential.
#
# Deploy:
#   aws cloudformation deploy \
#     --region us-east-1 \
#     --stack-name CryptoTools-CodeBuild-GitHub-Runners \
#     --template-file cfn/ci/CodeBuild-GitHub-Runners.yml \
#     --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND
#
# A workflow job selects a runner with:
#   runs-on: codebuild-<ProjectPrefix>-<linux|macos|windows>-<repo-name>-${{ github.run_id }}-${{ github.run_attempt }}
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
Description: CodeBuild-hosted GitHub Actions runners for Crypto Tools CI

Parameters:
  Repositories:
    Type: CommaDelimitedList
    Description: owner/name of each GitHub repository that gets runner projects.
    Default: aws/aws-crypto-tools-rust
  AllowedActorIds:
    Type: String
    Description: >-
      Regex of numeric GitHub user IDs whose jobs may start a build. Jobs from
      anyone else are ignored by the webhook.
    Default: '^(19524298)$'
  ProjectPrefix:
    Type: String
    Description: Prefix of each fleet and runner project name.
    Default: CryptoToolsCI
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_-]*$'
  BuildTimeoutMinutes:
    Type: Number
    Description: Maximum minutes one runner build (one workflow job) may run.
    MinValue: 5
    MaxValue: 2160
    Default: 360
  LogRetentionDays:
    Type: Number
    Default: 30
  AlarmTopicArn:
    Type: String
    Description: SNS topic notified by the alarms. Empty creates alarms with no action.
    Default: ''

  LinuxComputeType:
    Type: String
    AllowedValues: [BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE, BUILD_GENERAL1_XLARGE, BUILD_GENERAL1_2XLARGE]
    Default: BUILD_GENERAL1_LARGE
  LinuxImage:
    Type: String
    Default: aws/codebuild/standard:7.0
  LinuxFleetCapacity:
    Type: Number
    Description: Linux fleet instances. Builds beyond them run on demand.
    MinValue: 1
    Default: 2

  EnableMacFleet:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  MacComputeType:
    Type: String
    AllowedValues: [BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE]
    Default: BUILD_GENERAL1_MEDIUM
  MacImage:
    Type: String
    Default: aws/codebuild/macos-arm-base:15
  MacFleetCapacity:
    Type: Number
    Description: macOS fleet instances. Fixed size; jobs beyond it queue.
    MinValue: 1
    Default: 2

  EnableWindowsFleet:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  WindowsComputeType:
    Type: String
    AllowedValues: [BUILD_GENERAL1_MEDIUM, BUILD_GENERAL1_LARGE]
    Default: BUILD_GENERAL1_LARGE
  WindowsImage:
    Type: String
    Default: aws/codebuild/windows-base:2019-3.0
  WindowsFleetCapacity:
    Type: Number
    Description: Windows fleet instances. Builds beyond them run on demand.
    MinValue: 1
    Default: 1

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]
  MacFleet: !Equals [!Ref EnableMacFleet, 'true']
  WindowsFleet: !Equals [!Ref EnableWindowsFleet, 'true']

Resources:
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ProjectPrefix}
      RetentionInDays: !Ref LogRetentionDays

  # Jobs on these runners get this role's credentials, so it carries only what
  # the runner itself needs. Workflows that call AWS keep assuming their own
  # role through GitHub OIDC.
  RunnerServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: runner
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BuildLogGroup}:log-stream:*
              # Used when the account's GitHub credential is a GitHub App connection.
              - Effect: Allow
                Action:
                  - codeconnections:GetConnection
                  - codeconnections:GetConnectionToken
                  - codeconnections:UseConnection
                Resource: !Sub arn:${AWS::Partition}:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/*

  LinuxFleet:
    Type: AWS::CodeBuild::Fleet
    Properties:
      Name: !Sub ${ProjectPrefix}-linux
      EnvironmentType: LINUX_CONTAINER
      ComputeType: !Ref LinuxComputeType
      BaseCapacity: !Ref LinuxFleetCapacity
      OverflowBehavior: ON_DEMAND

  MacFleet:
    Type: AWS::CodeBuild::Fleet
    Condition: MacFleet
    Properties:
      Name: !Sub ${ProjectPrefix}-macos
      EnvironmentType: MAC_ARM
      ComputeType: !Ref MacComputeType
      BaseCapacity: !Ref MacFleetCapacity
      OverflowBehavior: QUEUE

  WindowsFleet:
    Type: AWS::CodeBuild::Fleet
    Condition: WindowsFleet
    Properties:
      Name: !Sub ${ProjectPrefix}-windows
      EnvironmentType: WINDOWS_SERVER_2019_CONTAINER
      ComputeType: !Ref WindowsComputeType
      BaseCapacity: !Ref WindowsFleetCapacity
      OverflowBehavior: ON_DEMAND

  Fn::ForEach::RepositoryRunners:
    - Repo
    - !Ref Repositories
    - LinuxRunner&{Repo}:
        Type: AWS::CodeBuild::Project
        Properties:
          Name: !Join ['-', [!Ref ProjectPrefix, linux, !Select [1, !Split ['/', !Ref Repo]]]]
          Description: !Join ['', ['GitHub Actions Linux runner for ', !Ref Repo]]
          ServiceRole: !GetAtt RunnerServiceRole.Arn
          TimeoutInMinutes: !Ref BuildTimeoutMinutes
          Artifacts:
            Type: NO_ARTIFACTS
          Source:
            Type: GITHUB
            Location: !Join ['', ['https://github.com/', !Ref Repo]]
          Environment:
            Type: LINUX_CONTAINER
            ComputeType: !Ref LinuxComputeType
            Image: !Ref LinuxImage
            PrivilegedMode: false
            Fleet:
              FleetArn: !GetAtt LinuxFleet.Arn
          LogsConfig:
            CloudWatchLogs:
              Status: ENABLED
              GroupName: !Ref BuildLogGroup
              StreamName: !Join ['/', [linux, !Select [1, !Split ['/', !Ref Repo]]]]
          Triggers:
            Webhook: true
            FilterGroups:
              - - Type: EVENT
                  Pattern: WORKFLOW_JOB_QUEUED
                - Type: ACTOR_ACCOUNT_ID
                  Pattern: !Ref AllowedActorIds

      MacRunner&{Repo}:
        Type: AWS::CodeBuild::Project
        Condition: MacFleet
        Properties:
          Name: !Join ['-', [!Ref ProjectPrefix, macos, !Select [1, !Split ['/', !Ref Repo]]]]
          Description: !Join ['', ['GitHub Actions macOS runner for ', !Ref Repo]]
          ServiceRole: !GetAtt RunnerServiceRole.Arn
          TimeoutInMinutes: !Ref BuildTimeoutMinutes
          Artifacts:
            Type: NO_ARTIFACTS
          Source:
            Type: GITHUB
            Location: !Join ['', ['https://github.com/', !Ref Repo]]
          Environment:
            Type: MAC_ARM
            ComputeType: !Ref MacComputeType
            Image: !Ref MacImage
            Fleet:
              FleetArn: !GetAtt MacFleet.Arn
          LogsConfig:
            CloudWatchLogs:
              Status: ENABLED
              GroupName: !Ref BuildLogGroup
              StreamName: !Join ['/', [macos, !Select [1, !Split ['/', !Ref Repo]]]]
          Triggers:
            Webhook: true
            FilterGroups:
              - - Type: EVENT
                  Pattern: WORKFLOW_JOB_QUEUED
                - Type: ACTOR_ACCOUNT_ID
                  Pattern: !Ref AllowedActorIds

      WindowsRunner&{Repo}:
        Type: AWS::CodeBuild::Project
        Condition: WindowsFleet
        Properties:
          Name: !Join ['-', [!Ref ProjectPrefix, windows, !Select [1, !Split ['/', !Ref Repo]]]]
          Description: !Join ['', ['GitHub Actions Windows runner for ', !Ref Repo]]
          ServiceRole: !GetAtt RunnerServiceRole.Arn
          TimeoutInMinutes: !Ref BuildTimeoutMinutes
          Artifacts:
            Type: NO_ARTIFACTS
          Source:
            Type: GITHUB
            Location: !Join ['', ['https://github.com/', !Ref Repo]]
          Environment:
            Type: WINDOWS_SERVER_2019_CONTAINER
            ComputeType: !Ref WindowsComputeType
            Image: !Ref WindowsImage
            Fleet:
              FleetArn: !GetAtt WindowsFleet.Arn
          LogsConfig:
            CloudWatchLogs:
              Status: ENABLED
              GroupName: !Ref BuildLogGroup
              StreamName: !Join ['/', [windows, !Select [1, !Split ['/', !Ref Repo]]]]
          Triggers:
            Webhook: true
            FilterGroups:
              - - Type: EVENT
                  Pattern: WORKFLOW_JOB_QUEUED
                - Type: ACTOR_ACCOUNT_ID
                  Pattern: !Ref AllowedActorIds

      QueueAlarmLinux&{Repo}:
        Type: AWS::CloudWatch::Alarm
        Properties:
          AlarmDescription: !Join ['', ['p90 linux runner queue wait above 5 minutes for ', !Ref Repo]]
          Namespace: AWS/CodeBuild
          MetricName: QueuedDuration
          Dimensions:
            - Name: ProjectName
              Value: !Join ['-', [!Ref ProjectPrefix, linux, !Select [1, !Split ['/', !Ref Repo]]]]
          ExtendedStatistic: p90
          Period: 300
          EvaluationPeriods: 3
          Threshold: 300
          ComparisonOperator: GreaterThanThreshold
          TreatMissingData: notBreaching
          AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

      QueueAlarmMac&{Repo}:
        Type: AWS::CloudWatch::Alarm
        Condition: MacFleet
        Properties:
          AlarmDescription: !Join ['', ['p90 macos runner queue wait above 5 minutes for ', !Ref Repo]]
          Namespace: AWS/CodeBuild
          MetricName: QueuedDuration
          Dimensions:
            - Name: ProjectName
              Value: !Join ['-', [!Ref ProjectPrefix, macos, !Select [1, !Split ['/', !Ref Repo]]]]
          ExtendedStatistic: p90
          Period: 300
          EvaluationPeriods: 3
          Threshold: 300
          ComparisonOperator: GreaterThanThreshold
          TreatMissingData: notBreaching
          AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

      QueueAlarmWindows&{Repo}:
        Type: AWS::CloudWatch::Alarm
        Condition: WindowsFleet
        Properties:
          AlarmDescription: !Join ['', ['p90 windows runner queue wait above 5 minutes for ', !Ref Repo]]
          Namespace: AWS/CodeBuild
          MetricName: QueuedDuration
          Dimensions:
            - Name: ProjectName
              Value: !Join ['-', [!Ref ProjectPrefix, windows, !Select [1, !Split ['/', !Ref Repo]]]]
          ExtendedStatistic: p90
          Period: 300
          EvaluationPeriods: 3
          Threshold: 300
          ComparisonOperator: GreaterThanThreshold
          TreatMissingData: notBreaching
          AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  # Publishes the number of running and queued runner builds per fleet every
  # minute. CodeBuild has no concurrency metric of its own.
  UsageMetricsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: usage-metrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codebuild:ListProjects
                Resource: '*'
              - Effect: Allow
                Action:
                  - codebuild:ListBuildsForProject
                  - codebuild:BatchGetBuilds
                Resource: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${ProjectPrefix}-*
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CryptoTools/CodeBuildRunners

  UsageMetricsFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 50
      Role: !GetAtt UsageMetricsRole.Arn
      Environment:
        Variables:
          PROJECT_PREFIX: !Sub ${ProjectPrefix}-
          NAMESPACE: CryptoTools/CodeBuildRunners
      Code:
        ZipFile: |
          import os
          from collections import Counter

          import boto3

          codebuild = boto3.client("codebuild")
          cloudwatch = boto3.client("cloudwatch")
          PREFIX = os.environ["PROJECT_PREFIX"]
          NAMESPACE = os.environ["NAMESPACE"]
          FLEETS = ("linux", "macos", "windows")
          # In-progress builds are among a project's most recent builds.
          RECENT_BUILDS = 300
          WAITING_PHASES = {"SUBMITTED", "QUEUED"}


          def projects():
              for page in codebuild.get_paginator("list_projects").paginate():
                  yield from (p for p in page["projects"] if p.startswith(PREFIX))


          def count(project):
              ids = []
              for page in codebuild.get_paginator("list_builds_for_project").paginate(
                  projectName=project, sortOrder="DESCENDING"
              ):
                  ids.extend(page["ids"])
                  if len(ids) >= RECENT_BUILDS:
                      break
              running = queued = 0
              for i in range(0, min(len(ids), RECENT_BUILDS), 100):
                  for build in codebuild.batch_get_builds(ids=ids[i : i + 100])["builds"]:
                      if build["buildStatus"] != "IN_PROGRESS":
                          continue
                      if build.get("currentPhase") in WAITING_PHASES:
                          queued += 1
                      else:
                          running += 1
              return running, queued


          def datum(name, value, dims):
              return {
                  "MetricName": name,
                  "Value": value,
                  "Unit": "Count",
                  "Dimensions": [{"Name": k, "Value": v} for k, v in dims.items()],
              }


          def handler(event, context):
              data = []
              running_by_fleet, queued_by_fleet = Counter(), Counter()
              for project in projects():
                  fleet = project[len(PREFIX) :].split("-", 1)[0]
                  if fleet not in FLEETS:
                      continue
                  running, queued = count(project)
                  running_by_fleet[fleet] += running
                  queued_by_fleet[fleet] += queued
                  dims = {"Fleet": fleet, "Project": project}
                  data += [datum("RunningBuilds", running, dims), datum("QueuedBuilds", queued, dims)]
              for fleet in FLEETS:
                  dims = {"Fleet": fleet}
                  data += [
                      datum("RunningBuilds", running_by_fleet[fleet], dims),
                      datum("QueuedBuilds", queued_by_fleet[fleet], dims),
                  ]
              for i in range(0, len(data), 1000):
                  cloudwatch.put_metric_data(Namespace=NAMESPACE, MetricData=data[i : i + 1000])

  UsageMetricsSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      Targets:
        - Id: usage-metrics
          Arn: !GetAtt UsageMetricsFunction.Arn

  UsageMetricsSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsageMetricsFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UsageMetricsSchedule.Arn

  UsageDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectPrefix}-runners
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Linux fleet: concurrent builds",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60, "stat": "Maximum",
                "metrics": [
                  ["CryptoTools/CodeBuildRunners", "RunningBuilds", "Fleet", "linux", {"label": "Running"}],
                  ["CryptoTools/CodeBuildRunners", "QueuedBuilds", "Fleet", "linux", {"label": "Queued"}]
                ],
                "annotations": {"horizontal": [
                  {"label": "Fleet capacity (beyond this runs on demand)", "value": ${LinuxFleetCapacity}}
                ]},
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "macOS fleet: concurrent builds",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60, "stat": "Maximum",
                "metrics": [
                  ["CryptoTools/CodeBuildRunners", "RunningBuilds", "Fleet", "macos", {"label": "Running"}],
                  ["CryptoTools/CodeBuildRunners", "QueuedBuilds", "Fleet", "macos", {"label": "Queued"}]
                ],
                "annotations": {"horizontal": [
                  {"label": "Capacity (beyond this queues)", "value": ${MacFleetCapacity}}
                ]},
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Windows fleet: concurrent builds",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60, "stat": "Maximum",
                "metrics": [
                  ["CryptoTools/CodeBuildRunners", "RunningBuilds", "Fleet", "windows", {"label": "Running"}],
                  ["CryptoTools/CodeBuildRunners", "QueuedBuilds", "Fleet", "windows", {"label": "Queued"}]
                ],
                "annotations": {"horizontal": [
                  {"label": "Fleet capacity (beyond this runs on demand)", "value": ${WindowsFleetCapacity}}
                ]},
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Running builds by project",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60, "stat": "Maximum",
                "metrics": [[{"expression": "SEARCH('{CryptoTools/CodeBuildRunners,Fleet,Project} MetricName=\"RunningBuilds\"', 'Maximum', 60)", "id": "running"}]],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Queue wait p90 (seconds)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [[{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"QueuedDuration\" ProjectName=\"${ProjectPrefix}\"', 'p90', 300)", "id": "queued"}]],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Jobs started per hour",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [[{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"Builds\" ProjectName=\"${ProjectPrefix}\"', 'Sum', 3600)", "id": "builds"}]],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Job duration p50 / p90 (seconds)",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [
                  [{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"Duration\" ProjectName=\"${ProjectPrefix}\"', 'p50', 3600)", "id": "p50"}],
                  [{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"Duration\" ProjectName=\"${ProjectPrefix}\"', 'p90', 3600)", "id": "p90"}]
                ],
                "yAxis": {"left": {"min": 0}}
              }
            },
            {
              "type": "metric", "x": 0, "y": 18, "width": 12, "height": 6,
              "properties": {
                "title": "Succeeded / failed jobs per hour",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 3600,
                "metrics": [
                  [{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"SucceededBuilds\" ProjectName=\"${ProjectPrefix}\"', 'Sum', 3600)", "id": "ok"}],
                  [{"expression": "SEARCH('{AWS/CodeBuild,ProjectName} MetricName=\"FailedBuilds\" ProjectName=\"${ProjectPrefix}\"', 'Sum', 3600)", "id": "failed"}]
                ],
                "yAxis": {"left": {"min": 0}}
              }
            }
          ]
        }

Outputs:
  LinuxFleetArn:
    Value: !GetAtt LinuxFleet.Arn
  MacFleetArn:
    Condition: MacFleet
    Value: !GetAtt MacFleet.Arn
  WindowsFleetArn:
    Condition: WindowsFleet
    Value: !GetAtt WindowsFleet.Arn
  RunnerServiceRoleArn:
    Value: !GetAtt RunnerServiceRole.Arn
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${ProjectPrefix}-runners
