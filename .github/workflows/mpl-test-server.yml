# MPL TestServer CI for aws-crypto-tools-commons. The run itself lives in
# mpl-test-server-reusable.yml, which language repositories call too.
name: MPL TestServer

on:
  pull_request:
    paths:
      - "mpl/test-server/**"
      - "test-server-common/**"
      - ".github/workflows/mpl-test-server.yml"
      - ".github/workflows/mpl-test-server-reusable.yml"
  push:
    branches:
      - main
    paths:
      - "mpl/test-server/**"
      - "test-server-common/**"
      - ".github/workflows/mpl-test-server.yml"
      - ".github/workflows/mpl-test-server-reusable.yml"
  # Nightly on main: rebuilds any server whose branch tip moved and saves it
  # to main's caches, which every pull request can restore.
  schedule:
    - cron: "57 7 * * *"
  workflow_dispatch:
    inputs:
      focus:
        description: Comma-separated languages under test; empty runs the full matrix.
        type: string
        default: ""
      language-repository:
        description: owner/name of a language repository to test from source.
        type: string
        default: ""
      language-ref:
        description: The language-repository ref to test.
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  # The reusable workflow's test job assumes an AWS role through GitHub OIDC.
  id-token: write
  # Its resolve job reads the pull request description.
  pull-requests: read

jobs:
  mpl:
    name: TestServer
    uses: ./.github/workflows/mpl-test-server-reusable.yml
    with:
      focus: ${{ inputs.focus || '' }}
      language-repository: ${{ inputs.language-repository || '' }}
      language-ref: ${{ inputs.language-ref || '' }}
      # The MPL repository's CI role does not trust this repository; this one
      # does, and reads the hierarchical keyring fixtures.
      aws-role-arn: arn:aws:iam::370957321024:role/GitHub-CI-Public-ESDK-Dafny-Role-us-west-2
    secrets:
      repo-pat: ${{ secrets.LANGUAGE_REPO_PAT }}
