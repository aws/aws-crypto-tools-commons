# Reusable workflow: match one library's public API to the snippets in a
# language repo's tests, and upload api-examples.json for the dashboard's
# API examples page.
#
# Discovery needs the language's own toolchain (nightly rustdoc, Gradle, etc.),
# so the caller runs it in an earlier job and uploads surface.json as an
# artifact. That job must run the snippet tests first: the dashboard shows
# api-examples.json as proof that the snippets compiled and passed in this run.
# This workflow downloads that artifact, checks out the calling commit, and runs
# api-examples/build_api_examples.py. The job fails when a way has no snippet;
# api-examples.json is uploaded either way.
#
# To show which calls CI built and ran, the caller's job also runs
# api-examples/combos.py generate and record, from the same commons ref, and
# puts the combos.json that it writes next to surface.json in the artifact.
#
# On a pull request from the same repository, the workflow also keeps one
# comment on the PR that links to the playground page for that PR.
#
#   api-examples-mpl:
#     needs: discover-mpl   # runs the snippet tests, then uploads mpl-surface
#     uses: aws/aws-crypto-tools-commons/.github/workflows/api-examples.yml@main
#     with:
#       library: mpl
#       language: rust
#       surface-artifact: mpl-surface
#       src: mpl/tests

name: API examples

on:
  workflow_call:
    inputs:
      library:
        description: The library the surface describes (mpl, esdk).
        type: string
        required: true
      language:
        description: The language of the calling repository (e.g. rust).
        type: string
        required: true
      surface-artifact:
        description: The name of the artifact that the caller uploaded with surface.json in it.
        type: string
        required: true
      surface-path:
        description: The path of surface.json inside that artifact.
        type: string
        default: surface.json
      src:
        description: Space-separated test source directories to scan for snippet markers.
        type: string
        required: true
      template:
        description: The language's combos.template, from the repository root. The playground uses it to write a new test.
        type: string
        default: ""
      combos-path:
        description: The path of combos.json inside the surface artifact. The step skips it when the file is not there.
        type: string
        default: combos.json
      artifact-name:
        description: The name of the uploaded artifact. The dashboard reads api-examples-<library>-<language>.
        type: string
        default: ""
      commons-ref:
        description: The aws-crypto-tools-commons ref to take the builder script from.
        type: string
        default: main
      runner:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  api-examples:
    name: API examples (${{ inputs.library }}, ${{ inputs.language }})
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Check out the calling repository
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out the builder script
        uses: actions/checkout@v4
        with:
          repository: aws/aws-crypto-tools-commons
          ref: ${{ inputs.commons-ref }}
          path: commons
          sparse-checkout: api-examples

      - name: Download surface.json
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.surface-artifact }}
          path: ${{ runner.temp }}/surface

      - name: Name the artifact
        id: name
        env:
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          LIBRARY: ${{ inputs.library }}
          LANGUAGE: ${{ inputs.language }}
        run: echo "name=${ARTIFACT_NAME:-api-examples-$LIBRARY-$LANGUAGE}" >> "$GITHUB_OUTPUT"

      - name: Match the API to the test snippets
        working-directory: repo
        env:
          SURFACE: ${{ runner.temp }}/surface/${{ inputs.surface-path }}
          SRC: ${{ inputs.src }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TEMPLATE: ${{ inputs.template }}
          COMBOS: ${{ runner.temp }}/surface/${{ inputs.combos-path }}
        run: |
          set -o pipefail
          python3 ../commons/api-examples/build_api_examples.py \
            --surface "$SURFACE" --src $SRC --repo "$REPOSITORY" --commit "$(git rev-parse HEAD)" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --template "$TEMPLATE" --combos "$COMBOS" \
            --out "$RUNNER_TEMP/out/api-examples.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload api-examples.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/out/api-examples.json
          if-no-files-found: error

  pr-comment:
    name: Link the playground on the PR
    needs: api-examples
    # Forks get a read-only token, so they cannot comment.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: write
    # A repository calls this workflow once per library, so the calls take turns to find the comment.
    concurrency:
      group: api-examples-comment-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Add or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- api-examples-playground -->";
            const pr = `${context.repo.owner}/${context.repo.repo}#${context.issue.number}`;
            const url = `https://aws.github.io/aws-crypto-tools-commons/api-examples/index.html?pr=${encodeURIComponent(pr)}`;
            const body = `${marker}\nTry the calls that this PR's API examples make, compared with the default branch: ${url}`;
            const comments = await github.paginate(github.rest.issues.listComments,
              { ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find(c => c.body?.startsWith(marker));
            if (!mine) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            } else if (mine.body !== body) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            }
