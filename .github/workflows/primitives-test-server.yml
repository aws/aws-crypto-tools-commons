# Primitives TestServer CI (aws-crypto-tools-commons)
#
# A Commons_Run: validates the model, builds the client + tests, then runs
# the full orchestrated pipeline (build + launch Rust Language_Server + run
# the Java test suite against it).
name: Primitives TestServer

on:
  pull_request:
    paths:
      - "primitives/test-server/**"
      - ".github/workflows/primitives-test-server.yml"
  push:
    branches: [main]
    paths:
      - "primitives/test-server/**"
      - ".github/workflows/primitives-test-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primitives-test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: primitives/test-server

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 (smithy-java 1.4.0 requires 21+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go (aws-lc-sys native builds need Go)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Cache Rust build artifacts (sccache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-primitives-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-primitives-

      - name: Validate Smithy model
        run: |
          cd model
          # smithy validate requires the smithy CLI; use Gradle-based validation
          cd ../client-java
          # Generate Gradle wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.10
          fi
          ./gradlew smithyBuild --info || echo "::warning::smithy validate requires Gradle wrapper setup"

      - name: Build client-java (codegen)
        run: |
          cd client-java
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.10; fi
          ./gradlew build

      - name: Build tests
        run: |
          cd tests
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.10; fi
          ./gradlew build

      - name: Build orchestrator
        run: |
          cd orchestrator
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.10; fi
          ./gradlew build

      - name: Orchestrate (clone Rust server from configured branch, build, launch, test)
        run: |
          cd orchestrator
          ./gradlew --console=plain run --args="context=commons"
