# ============================================================================
# DB-ESDK TestServer CI (aws-crypto-tools-commons — the Commons_Repository)
# ----------------------------------------------------------------------------
# Product-namespaced sibling of esdk-test-server.yml (GitHub Actions only
# discovers workflows directly under .github/workflows/, so products are
# namespaced by filename prefix, not subdirectory). This runs the DB-ESDK
# TestServer as a Commons_Run: one `make orchestrate` resolves every target
# from the Configuration_Set in this working tree, clones + builds each
# Language_Server, launches them, runs the single Tests suite over the
# cross-language matrix, and reports one fail-open result.
#
# DB-ESDK vs ESDK differences (why this is shorter):
#   * Three targets — java-v3, rust-v1, net-v4 — so JDK 21 (commons harness +
#     Java server), a Rust toolchain (+ Go/cmake for the aws-lc-sys native
#     build the Rust server pulls in), and the .NET 8 SDK. No python/node/c.
#   * The servers consume the PUBLISHED DB-ESDK libraries (Maven jar, the
#     aws-db-esdk crate, the NuGet package) — there is no Dafny transpile step.
#   * The servers live in the PUBLIC aws-database-encryption-sdk-dynamodb repo
#     (server-config.json Server_Locations), so the cross-repo clone needs no
#     PAT — the SSH URL is rewritten to plain (unauthenticated) HTTPS.
#
# AWS/KMS (ONLINE, REQUIRED): DB-ESDK scenarios call real AWS KMS and, for the
# searchable-encryption tests, a branch-key DynamoDB keystore. The assumed
# OIDC role therefore needs, in the target account/region:
#   * kms:Encrypt/Decrypt/GenerateDataKey* on the item-encryption KMS key,
#   * kms:Decrypt/GenerateDataKeyWithoutPlaintext on the beacon keystore KMS key,
#   * dynamodb:GetItem/Query/BatchGetItem on the branch-key store table,
#   * kms:GetPublicKey + Encrypt/Decrypt on the asymmetric RSA key (aws-kms-rsa).
# Override the role and (optional) resource ARNs with the repo variables below;
# the run fails fast (before orchestrate) if credentials are unusable.
# ============================================================================

name: DB-ESDK TestServer

on:
  pull_request:
    paths:
      - "dbesdk/test-server/**"
      - ".github/workflows/dbesdk-test-server.yml"
  push:
    branches:
      - main
    paths:
      - "dbesdk/test-server/**"
      - ".github/workflows/dbesdk-test-server.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  # For the GitHub OIDC token exchange in configure-aws-credentials.
  id-token: write

jobs:
  dbesdk-test-server:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      AWS_DEFAULT_REGION: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      # Daemon-less so every server/Tests JVM the orchestrator forks inherits
      # the live step environment (the short-lived OIDC AWS_* credentials).
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # OIDC role to assume for the required KMS + keystore scenarios. Defaults
      # to the shared ESDK TestServer CI role (its trust policy already trusts
      # aws-crypto-tools-commons); that role's permissions are extended to cover
      # the DB-ESDK item key, the beacon-keystore KMS key + branch-key DDB table,
      # and the asymmetric RSA key. Override via the repo variable to target a
      # different account/role.
      KMS_CI_ROLE_ARN: ${{ vars.DBESDK_TEST_SERVER_KMS_ROLE_ARN || 'arn:aws:iam::370957321024:role/esdk-test-server-ci-kms-role' }}

    steps:
      - name: Checkout (working tree = the Configuration_Set every target resolves from)
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin) for the commons harness + Java server
        # smithy-java (client/tests/orchestrator) needs JDK 21+; the Java
        # Language_Server build consumes the published DB-ESDK jar. The commons
        # Makefile honors a caller-set JAVA_HOME (`JAVA_HOME ?=`).
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Rust toolchain (for the rust-v1 Language_Server)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Set up Go (for the Rust server's aws-lc-sys native build)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          # This is not a Go project (Go is only the native toolchain for the
          # rust server's aws-lc-sys build), so there is no go.sum to key a
          # module cache on — disable setup-go's cache to avoid a spurious
          # "Dependencies file is not found" restore warning.
          cache: false

      - name: Set up .NET 8 (for the net-v4 Language_Server)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore Gradle + cargo + NuGet caches
        uses: actions/cache/restore@v4
        id: caches
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
          key: >-
            ${{ runner.os }}-dbesdk-test-server-${{ hashFiles(
              'dbesdk/test-server/*/build.gradle.kts',
              'dbesdk/test-server/*/gradle/wrapper/gradle-wrapper.properties'
            ) }}
          restore-keys: |
            ${{ runner.os }}-dbesdk-test-server-

      - name: Install Smithy CLI
        # `make validate` runs `smithy validate` on the model. Deterministic
        # download of the official release, version-pinned; no third-party action.
        run: |
          set -euo pipefail
          SMITHY_VERSION="1.58.0"
          url="https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip"
          tmp="$(mktemp -d)"
          curl -sSL "$url" -o "$tmp/smithy-cli.zip"
          unzip -q "$tmp/smithy-cli.zip" -d "$tmp"
          sudo "$tmp/smithy-cli-linux-x86_64/install"
          smithy --version

      - name: Rewrite the DBE repo SSH URL to public HTTPS
        # The Server_Locations clone aws-database-encryption-sdk-dynamodb via
        # its SSH URL. That repo is PUBLIC, so no PAT is needed — rewrite SSH to
        # plain HTTPS for the job so `git clone git@github.com:aws/...` works
        # without SSH keys on the runner. CI-only; local dev keeps using SSH.
        run: |
          set -euo pipefail
          git config --global \
            url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure AWS credentials via OIDC
        # continue-on-error so the next step fails with an actionable message
        # (rather than a generic action error) when no role is configured / a
        # fork PR has no id-token.
        id: aws-credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.KMS_CI_ROLE_ARN }}
          aws-region: ${{ vars.DBESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}

      - name: Verify AWS credentials are active (gates the orchestrated run)
        # DB-ESDK scenarios call real KMS + a branch-key DDB keystore, so the
        # run cannot pass without usable credentials. Fail HERE, before
        # orchestrate, with an actionable message.
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::No usable AWS credentials for the required DB-ESDK KMS scenarios." >&2
            echo "This run needs GitHub OIDC access to the role ${KMS_CI_ROLE_ARN}, whose trust" >&2
            echo "policy must trust aws-crypto-tools-commons and whose permissions must reach the" >&2
            echo "DB-ESDK KMS keys + branch-key DynamoDB keystore. A fork PR with no id-token" >&2
            echo "cannot exercise the required KMS scenarios and therefore cannot pass." >&2
            exit 1
          fi

      - name: Validate model (smithy validate + model smoke checks)
        working-directory: dbesdk/test-server
        run: make validate

      - name: Orchestrated Commons_Run (make orchestrate)
        # One invocation resolves every target from this working tree's
        # Configuration_Set, clones + builds each Language_Server from the
        # DB-ESDK product repo at its Server_Location, launches them, runs the
        # Tests over the cross-language matrix, and exits non-zero on any failed
        # result (which fails this step and short-circuits the job).
        working-directory: dbesdk/test-server
        env:
          # Nine concurrent server builds on a 2-core runner need a wide
          # readiness window (mirrors the ESDK workflow's 900s).
          DBESDK_TESTSERVER_READY_TIMEOUT_SECONDS: "900"
        run: make orchestrate

      - name: Publish test results to the run summary
        # Renders the cross-language coverage matrix, failed-tests table,
        # skipped-by-reason table (with languages), and known-bugs table on the
        # Actions run's Summary page (visible on the website, no artifact
        # download) directly from the JUnit XML the Tests suite writes.
        # python3 is preinstalled on ubuntu-latest.
        if: always()
        run: |
          python3 dbesdk/test-server/tools/ci_summary.py \
            dbesdk/test-server/tests/build/test-results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports + Resolution_Record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbesdk-test-server-reports
          path: |
            dbesdk/test-server/orchestrator/build/resolution-record.json
            dbesdk/test-server/orchestrator/build/launch/*/*.log
            dbesdk/test-server/tests/build/reports/tests
            dbesdk/test-server/tests/build/test-results
          if-no-files-found: ignore

      - name: Save Gradle + cargo + NuGet caches
        if: always() && steps.caches.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry
            ~/.cargo/git
            ~/.nuget/packages
          key: >-
            ${{ runner.os }}-dbesdk-test-server-${{ hashFiles(
              'dbesdk/test-server/*/build.gradle.kts',
              'dbesdk/test-server/*/gradle/wrapper/gradle-wrapper.properties'
            ) }}
