name: Dashboard tests

on:
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard-tests.yml"]
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PR Review page
        run: node --test dashboard/pr-review/review.test.js
