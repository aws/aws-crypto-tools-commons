# ============================================================================
# ESDK TestServer CI
# ----------------------------------------------------------------------------
# LOCATION MATTERS: this file lives FLAT, directly under `.github/workflows/`.
# GitHub Actions only discovers workflow files that sit directly in
# `.github/workflows/` — a nested file such as `.github/workflows/esdk/...`
# would NEVER be triggered. Because this repo (aws-crypto-tools-commons) hosts
# tooling for multiple products, we namespace per product with a filename
# prefix instead of a subdirectory: `esdk-` marks this as the ESDK TestServer
# workflow. Future products get e.g. `s3ec-test-server.yml`, and so on.
#
# WHAT THIS RUNS: the commons ESDK TestServer is currently JAVA-ONLY. It runs
# offline Raw-AES/Raw-RSA round-trips AND the required online AWS KMS keyring
# round-trips (which need AWS credentials — see AWS/KMS below). The root
# Makefile's orchestrator already does build + launch + run + report in one shot,
# so this workflow stays simple and self-contained: set up a JDK, validate the
# model, build the modules, configure AWS credentials via OIDC, and run the
# orchestrated end-to-end round trip. Contrast this with the multi-language S3EC reusable
# workflow (Ruby/PHP/Go/C++ + AWS creds + KMS orchestrated via make
# build/start/wait/run/stop) that inspired the shape here.
#
# AWS/KMS (ONLINE, REQUIRED — task 15.7): the KMS keyring scenarios
# (AwsKms/AwsKmsMrk/AwsKmsMultiKeyring/AwsKmsRsa/AwsKmsDiscovery) are ONLINE and
# REQUIRED — they always run against the KMS_Test_Resources (whose ARNs default
# in KmsRuntimeConfig) and a run does NOT pass unless they run and pass
# (Requirements 14.8, 14.9). This workflow must therefore supply AWS credentials
# for the run to pass:
#   * permissions: { id-token: write }  — for the GitHub OIDC token exchange.
#   * a `configure-aws-credentials@v4` step that assumes KMS_CI_ROLE_ARN, which
#     DEFAULTS to the shared role (its CDK `roleArn` CfnOutput) so NO repo
#     variable is needed to run against the shared KMS_Test_Resources; the key
#     ARNs likewise default in KmsRuntimeConfig. The step is continue-on-error and
#     is followed by an `aws sts get-caller-identity` check that fails GRACEFULLY
#     with an actionable message when credentials cannot be obtained (e.g. a fork
#     PR with no id-token) — the required KMS scenarios cannot pass without creds.
#   * GRADLE_OPTS=-Dorg.gradle.daemon=false (job env) so Gradle never reuses a
#     daemon with a stale, credential-free environment; every Gradle invocation
#     (and the in-process server JVM it forks) uses the live step environment.
#   * OPTIONAL KMS_Test_Resources ARN overrides exported as `ESDK_TESTSERVER_KMS_*`
#     environment variables (read by KmsRuntimeConfig); omitted, the built-in
#     default ARNs (the shared keys) are used. Env vars are used rather than
#     `-Desdk.testserver.kms.*` on the make process because the KMS Tests run in a
#     nested JVM the orchestrator launches, which inherits the parent ENVIRONMENT
#     but not the make process's system properties.
#
# REPO VARIABLES ARE OPTIONAL. By default this workflow targets the shared
# KMS_Test_Resources: the OIDC role defaults to the CDK stack's `roleArn` and the
# key ARNs default in KmsRuntimeConfig, so a run needs only OIDC access to that
# role (granted to workflows in the ESDK repositories). To target a DIFFERENT
# account/role or key set, override under Settings → Secrets and variables →
# Actions → Variables (all are non-secret ARNs from the CDK CfnOutputs, 14.13):
#   * vars.ESDK_TEST_SERVER_KMS_ROLE_ARN           — OIDC IAM role ARN to assume.
#   * vars.ESDK_TEST_SERVER_KMS_SYMMETRIC_KEY_ARN  — symmetric KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_MRK_ARN            — multi-region KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_RSA_KEY_ARN        — asymmetric RSA KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_REGION             — AWS region (default us-west-2).
# ============================================================================

name: ESDK TestServer

on:
  pull_request:
    paths:
      - "esdk/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    paths:
      - "esdk/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Allow an aggregate/parent CI workflow to reuse this one.
  workflow_call:

permissions:
  contents: read
  # Required for the GitHub OIDC token exchange used by the gated
  # configure-aws-credentials step (task 15.7). Harmless when the KMS path is
  # not configured (no creds step runs).
  id-token: write

jobs:
  esdk-test-server:
    # Pure-JVM build; ubuntu is sufficient (no macOS runner needed).
    runs-on: ubuntu-latest

    # Default AWS region for the whole job so EVERY step — including the first
    # Gradle invocation that starts the long-lived Gradle daemon — has AWS_REGION
    # in its environment. Without this, the daemon (started by "Build all modules"
    # BEFORE the credentials step) would spawn the nested server JVM with no
    # region, and the server's KmsClient would fail region resolution. The OIDC
    # credentials step may still override this with the same value; the server
    # also defaults to us-west-2 as a final fallback (EsdkClientFactory).
    env:
      AWS_REGION: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      AWS_DEFAULT_REGION: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
      # Disable the Gradle daemon for the whole job. A daemon captures its
      # environment at start and reuses it across builds, so short-lived OIDC
      # AWS_* credentials configured by an earlier step would NOT reach the
      # daemon-forked server/Tests JVMs. Running daemon-less makes every Gradle
      # invocation (and the server JVM it forks) use the live step environment,
      # which has the credentials.
      GRADLE_OPTS: -Dorg.gradle.daemon=false
      # The OIDC role to assume for the required KMS scenarios. DEFAULTS to the
      # role the CDK EsdkTestServerKmsStack created for the shared
      # KMS_Test_Resources (its `roleArn` CfnOutput), so CI runs against the
      # shared keys with NO repo variables configured. Override with the repo
      # variable ESDK_TEST_SERVER_KMS_ROLE_ARN to target a different account/role.
      # This is an IAM role ARN, not a secret.
      KMS_CI_ROLE_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_ROLE_ARN || 'arn:aws:iam::370957321024:role/esdk-test-server-ci-kms-role' }}

    steps:
      - name: Checkout
        # No submodules needed for the commons Java-only path.
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        # smithy-java requires JDK 21+. setup-java exports JAVA_HOME to this
        # JDK; the Makefile honors an already-set JAVA_HOME (`JAVA_HOME ?=`), so
        # its macOS-only /usr/libexec/java_home probing is bypassed in CI.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle caches and wrappers
        # Four independent Gradle builds live under esdk/test-server
        # (client-java, servers/java, tests, orchestrator). Key on every
        # gradle build script + wrapper descriptor beneath that tree so the
        # cache invalidates when any module's build config changes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles(
              'esdk/test-server/**/*.gradle*',
              'esdk/test-server/**/gradle-wrapper.properties'
            ) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Smithy CLI
        # `make validate` runs `smithy validate` on the model before the pure
        # bash smoke checks. The Smithy CLI is NOT preinstalled on ubuntu-latest,
        # so we install it from the official Smithy release using the installer
        # bundled in the release archive. We pin the version (1.58.0) to match
        # the model's smithy-protocol-traits:1.58.0 dependency for deterministic
        # builds. This is preferred over skipping `smithy validate` because it
        # keeps full model-validation coverage in CI; the install is a single
        # deterministic download + bundled `install` script (no third-party
        # action, no supply-chain surface beyond the official Smithy release).
        run: |
          set -euo pipefail
          SMITHY_VERSION="1.58.0"
          url="https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip"
          tmp="$(mktemp -d)"
          curl -sSL "$url" -o "$tmp/smithy-cli.zip"
          unzip -q "$tmp/smithy-cli.zip" -d "$tmp"
          sudo "$tmp/smithy-cli-linux-x86_64/install"
          smithy --version

      - name: Configure AWS credentials via OIDC
        # Assumes the KMS OIDC role (KMS_CI_ROLE_ARN, which DEFAULTS to the shared
        # role — no repo variable required) and exports short-lived AWS_*
        # credentials + AWS_REGION for the subsequent steps (Requirements 14.11,
        # 14.12).
        #
        # ORDER MATTERS: this runs BEFORE the first Gradle invocation (Build all
        # modules) so the credentials are present in the environment every Gradle
        # invocation (and the in-process server JVM it forks) inherits. Combined
        # with the daemon-less GRADLE_OPTS above, the server's KMS client always
        # sees these credentials.
        #
        # continue-on-error: a failure here (e.g. a fork PR with no id-token, or a
        # repo without OIDC access to the role) does NOT abruptly end the job with
        # a generic action error; the next step reports a clear, actionable message.
        id: aws-credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.KMS_CI_ROLE_ARN }}
          aws-region: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}

      - name: Verify AWS credentials are active
        # The KMS keyring scenarios are REQUIRED and call real AWS KMS, so the run
        # cannot pass without usable credentials. Confirm they resolve before the
        # build/run and, if not, fail GRACEFULLY with an actionable message rather
        # than surfacing a deep "Unable to load credentials" error from inside the
        # server later. Prints the assumed role ARN / account (not secrets).
        run: |
          if ! aws sts get-caller-identity; then
            echo "::error::No usable AWS credentials for the required KMS keyring scenarios." >&2
            echo "The ESDK TestServer KMS scenarios are required and call real AWS KMS, so this" >&2
            echo "run needs GitHub OIDC credentials for the role:" >&2
            echo "    ${KMS_CI_ROLE_ARN}" >&2
            echo "That role is assumable by workflows in the ESDK repositories. Runs without OIDC" >&2
            echo "access to it (for example a pull request from a fork) cannot exercise the KMS" >&2
            echo "scenarios and therefore cannot pass. To target a different account/role, set the" >&2
            echo "ESDK_TEST_SERVER_KMS_ROLE_ARN repository variable (Settings -> Secrets and" >&2
            echo "variables -> Actions -> Variables)." >&2
            exit 1
          fi

      - name: Validate model (smithy validate + model smoke checks)
        working-directory: esdk/test-server
        run: make validate

      - name: Build all modules (compile/codegen, tests skipped)
        working-directory: esdk/test-server
        run: make build

      - name: Orchestrate end-to-end round trip (headline check)
        # The orchestrator boots the Java Language_Server on its configured
        # Configuration_Set port and runs the single Tests suite to a fail-open
        # SUCCESS. This is the most representative end-to-end check, so it is
        # the headline. (An in-process `make test` is also available; the
        # orchestrated path supersedes it here.)
        #
        # The ESDK_TESTSERVER_KMS_* environment variables OPTIONALLY override the
        # KMS_Test_Resources coordinates for the nested Tests JVM (read by
        # KmsRuntimeConfig, Requirement 14.13). When the repo variables are unset
        # they resolve to EMPTY and KmsRuntimeConfig falls back to the built-in
        # default ARNs for the shared keys, so the required KMS scenarios still run
        # (against the defaults) as long as the creds step above provided credentials.
        working-directory: esdk/test-server
        env:
          ESDK_TESTSERVER_KMS_SYMMETRIC_KEY_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_SYMMETRIC_KEY_ARN }}
          ESDK_TESTSERVER_KMS_MRK_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_MRK_ARN }}
          ESDK_TESTSERVER_KMS_RSA_KEY_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_RSA_KEY_ARN }}
          ESDK_TESTSERVER_KMS_REGION: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
        run: make orchestrate

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esdk-test-server-reports
          # JUnit HTML (reports/tests) and XML (test-results) for the three
          # modules that run tests. client-java builds with `-x test` and emits
          # no reports, so it is intentionally omitted. `if: always()` uploads
          # even when an earlier step failed, to aid debugging.
          path: |
            esdk/test-server/servers/java/build/reports/tests
            esdk/test-server/servers/java/build/test-results
            esdk/test-server/tests/build/reports/tests
            esdk/test-server/tests/build/test-results
            esdk/test-server/orchestrator/build/reports/tests
            esdk/test-server/orchestrator/build/test-results
          if-no-files-found: ignore
