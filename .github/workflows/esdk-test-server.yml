# ============================================================================
# ESDK TestServer CI
# ----------------------------------------------------------------------------
# LOCATION MATTERS: this file lives FLAT, directly under `.github/workflows/`.
# GitHub Actions only discovers workflow files that sit directly in
# `.github/workflows/` — a nested file such as `.github/workflows/esdk/...`
# would NEVER be triggered. Because this repo (aws-crypto-tools-commons) hosts
# tooling for multiple products, we namespace per product with a filename
# prefix instead of a subdirectory: `esdk-` marks this as the ESDK TestServer
# workflow. Future products get e.g. `s3ec-test-server.yml`, and so on.
#
# WHAT THIS RUNS: the commons ESDK TestServer is currently JAVA-ONLY. Its blob
# round-trip uses an OFFLINE Raw-AES keyring — no AWS account, no KMS, no
# network. The root Makefile's orchestrator already does build + launch + run +
# report in one shot, so this workflow stays simple and self-contained: set up
# a JDK, validate the model, build the modules, and run the orchestrated
# end-to-end round trip. Contrast this with the multi-language S3EC reusable
# workflow (Ruby/PHP/Go/C++ + AWS creds + KMS orchestrated via make
# build/start/wait/run/stop) that inspired the shape here.
#
# AWS/KMS (ONLINE, CREDENTIAL-GATED — task 15.7): the offline Raw-AES/Raw-RSA
# blob & stream round trips always run with NO AWS access. The KMS keyring
# scenarios (AwsKms/AwsKmsMrk/AwsKmsMultiKeyring/AwsKmsRsa/AwsKmsDiscovery) are
# ONLINE and are contributed to the Tests only when a complete KMS runtime
# config AND resolvable AWS credentials are present (the KmsRuntimeConfig gate,
# Requirements 14.8, 14.9). This workflow wires those in, GATED so the offline
# path is untouched when the repo has no KMS role/vars configured:
#   * permissions: { id-token: write }  — for the GitHub OIDC token exchange.
#   * a `configure-aws-credentials@v4` step that runs ONLY when the repo
#     variable `ESDK_TEST_SERVER_KMS_ROLE_ARN` is set (otherwise no creds → the
#     gate is not satisfied → KMS scenarios are skipped, offline suite passes).
#   * the KMS_Test_Resources coordinates exported as `ESDK_TESTSERVER_KMS_*`
#     environment variables (read by KmsRuntimeConfig). Env vars are used rather
#     than `-Desdk.testserver.kms.*` on the make process because the KMS Tests
#     run in a nested JVM the orchestrator launches, which inherits the parent
#     ENVIRONMENT but not the make process's system properties.
#
# REQUIRED REPO VARIABLES/SECRETS (configure under Settings → Secrets and
# variables → Actions → Variables) to enable the KMS scenarios:
#   * vars.ESDK_TEST_SERVER_KMS_ROLE_ARN           — IAM role ARN from the CDK
#         EsdkTestServerKmsStack (the OIDC role); its presence GATES the creds
#         step and the whole KMS path.
#   * vars.ESDK_TEST_SERVER_KMS_SYMMETRIC_KEY_ARN  — symmetric KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_MRK_ARN            — multi-region KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_RSA_KEY_ARN        — asymmetric RSA KMS key ARN.
#   * vars.ESDK_TEST_SERVER_KMS_REGION             — AWS region (optional;
#         defaults to us-west-2).
# All five come from the CDK stack's CfnOutputs (Requirement 14.13). When they
# are absent (e.g. a fork PR), the creds step is skipped and only the offline
# suite runs.
# ============================================================================

name: ESDK TestServer

on:
  pull_request:
    paths:
      - "esdk/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  push:
    paths:
      - "esdk/test-server/**"
      - ".github/workflows/esdk-test-server.yml"
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Allow an aggregate/parent CI workflow to reuse this one.
  workflow_call:

permissions:
  contents: read
  # Required for the GitHub OIDC token exchange used by the gated
  # configure-aws-credentials step (task 15.7). Harmless when the KMS path is
  # not configured (no creds step runs).
  id-token: write

jobs:
  esdk-test-server:
    # Pure-JVM build; ubuntu is sufficient (no macOS runner needed).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # No submodules needed for the commons Java-only path.
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        # smithy-java requires JDK 21+. setup-java exports JAVA_HOME to this
        # JDK; the Makefile honors an already-set JAVA_HOME (`JAVA_HOME ?=`), so
        # its macOS-only /usr/libexec/java_home probing is bypassed in CI.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle caches and wrappers
        # Four independent Gradle builds live under esdk/test-server
        # (client-java, servers/java, tests, orchestrator). Key on every
        # gradle build script + wrapper descriptor beneath that tree so the
        # cache invalidates when any module's build config changes.
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            ${{ runner.os }}-gradle-${{ hashFiles(
              'esdk/test-server/**/*.gradle*',
              'esdk/test-server/**/gradle-wrapper.properties'
            ) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Smithy CLI
        # `make validate` runs `smithy validate` on the model before the pure
        # bash smoke checks. The Smithy CLI is NOT preinstalled on ubuntu-latest,
        # so we install it from the official Smithy release using the installer
        # bundled in the release archive. We pin the version (1.58.0) to match
        # the model's smithy-protocol-traits:1.58.0 dependency for deterministic
        # builds. This is preferred over skipping `smithy validate` because it
        # keeps full model-validation coverage in CI; the install is a single
        # deterministic download + bundled `install` script (no third-party
        # action, no supply-chain surface beyond the official Smithy release).
        run: |
          set -euo pipefail
          SMITHY_VERSION="1.58.0"
          url="https://github.com/smithy-lang/smithy/releases/download/${SMITHY_VERSION}/smithy-cli-linux-x86_64.zip"
          tmp="$(mktemp -d)"
          curl -sSL "$url" -o "$tmp/smithy-cli.zip"
          unzip -q "$tmp/smithy-cli.zip" -d "$tmp"
          sudo "$tmp/smithy-cli-linux-x86_64/install"
          smithy --version

      - name: Validate model (smithy validate + model smoke checks)
        working-directory: esdk/test-server
        run: make validate

      - name: Build all modules (compile/codegen, tests skipped)
        working-directory: esdk/test-server
        run: make build

      - name: Configure AWS credentials via OIDC (gated — only when KMS role is set)
        # Runs ONLY when the repo variable ESDK_TEST_SERVER_KMS_ROLE_ARN is
        # configured. Assumes the CDK-created OIDC role (least-privilege KMS on
        # the three keys) and exports short-lived AWS_* credentials + AWS_REGION
        # as environment variables for the subsequent steps (Requirements 14.11,
        # 14.12). When the variable is absent (e.g. a fork PR), this step is
        # skipped, no credentials are present, and the KMS scenarios are skipped
        # so the offline suite still runs (Requirements 14.8, 14.9).
        if: ${{ vars.ESDK_TEST_SERVER_KMS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ESDK_TEST_SERVER_KMS_ROLE_ARN }}
          aws-region: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}

      - name: Orchestrate end-to-end round trip (headline check)
        # The orchestrator boots the Java Language_Server on its configured
        # Configuration_Set port and runs the single Tests suite to a fail-open
        # SUCCESS. This is the most representative end-to-end check, so it is
        # the headline. (An in-process `make test` is also available; the
        # orchestrated path supersedes it here.)
        #
        # The ESDK_TESTSERVER_KMS_* environment variables carry the
        # KMS_Test_Resources coordinates to the nested Tests JVM (read by
        # KmsRuntimeConfig, Requirement 14.13). They resolve to EMPTY when the
        # repo variables are unset, so the KMS gate is not satisfied and only the
        # offline scenarios run; combined with the (skipped) creds step above,
        # the offline path is completely untouched when KMS is not configured.
        working-directory: esdk/test-server
        env:
          ESDK_TESTSERVER_KMS_SYMMETRIC_KEY_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_SYMMETRIC_KEY_ARN }}
          ESDK_TESTSERVER_KMS_MRK_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_MRK_ARN }}
          ESDK_TESTSERVER_KMS_RSA_KEY_ARN: ${{ vars.ESDK_TEST_SERVER_KMS_RSA_KEY_ARN }}
          ESDK_TESTSERVER_KMS_REGION: ${{ vars.ESDK_TEST_SERVER_KMS_REGION || 'us-west-2' }}
        run: make orchestrate

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esdk-test-server-reports
          # JUnit HTML (reports/tests) and XML (test-results) for the three
          # modules that run tests. client-java builds with `-x test` and emits
          # no reports, so it is intentionally omitted. `if: always()` uploads
          # even when an earlier step failed, to aid debugging.
          path: |
            esdk/test-server/servers/java/build/reports/tests
            esdk/test-server/servers/java/build/test-results
            esdk/test-server/tests/build/reports/tests
            esdk/test-server/tests/build/test-results
            esdk/test-server/orchestrator/build/reports/tests
            esdk/test-server/orchestrator/build/test-results
          if-no-files-found: ignore
