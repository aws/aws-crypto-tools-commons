# Unit tests for the scripts that api-examples.yml runs for each language repository,
# for the types page's tools, and for the playground and types pages' logic.

name: API examples builder

on:
  pull_request:
    paths:
      - "api-examples/**"
      - "dashboard/api-examples/**"
      - ".github/workflows/api-examples-builder.yml"
  push:
    branches:
      - main
    paths:
      - "api-examples/**"
      - "dashboard/api-examples/**"
      - ".github/workflows/api-examples-builder.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: builder unit tests
    runs-on: codebuild-CryptoToolsCI-linux-aws-crypto-tools-commons-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: python3 -m unittest discover -s api-examples -v

      - name: Types page tool tests
        run: python3 -m unittest discover -s api-examples/types -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playground and types page tests
        run: >-
          node --test dashboard/api-examples/playground.test.js dashboard/api-examples/usage.test.js
          dashboard/api-examples/types.test.js
