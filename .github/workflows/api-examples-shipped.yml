# Read each released ESDK and MPL package, and upload what its API takes as
# api-examples-<library>-<language>-shipped. The types page's rows for these
# languages come from these artifacts, through api-examples/types/other_languages.py.
# api-examples/read_shipped.py downloads the newest release and writes
# surface.json, and api-examples/build_api_examples.py turns that into
# api-examples.json. Nothing is built or tested.

name: API examples (shipped)

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "api-examples/read_shipped.py"
      - "api-examples/shipped/**"
      - "api-examples/type-phrases.json"
      - ".github/workflows/api-examples-shipped.yml"

permissions:
  contents: read

jobs:
  shipped:
    name: shipped ${{ matrix.library }} (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java, python, dotnet, go, javascript]
        library: [mpl, esdk]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: api-examples

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "17"

      - if: matrix.language == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the released package
        env:
          LANGUAGE: ${{ matrix.language }}
          LIBRARY: ${{ matrix.library }}
        run: |
          python3 api-examples/read_shipped.py --language "$LANGUAGE" --library "$LIBRARY" \
            --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/surface.json"

      - name: Write api-examples.json
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -o pipefail
          python3 api-examples/build_api_examples.py --surface "$RUNNER_TEMP/surface.json" \
            --repo "$REPOSITORY" --commit "$GITHUB_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --out "$RUNNER_TEMP/out/api-examples.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: api-examples-${{ matrix.library }}-${{ matrix.language }}-shipped
          path: ${{ runner.temp }}/out/api-examples.json
          if-no-files-found: error
