# Mutation testing of a Rust crate, callable by aws-crypto-tools-rust.
#
# A mutant is a small change to the library, such as `<` turned into `<=`.
# This job records which tests run which lines (the commons Tests against the
# crate's test server, and the crate's own tests), builds every mutant into
# one copy of the crate, and runs the tests that reach each mutant's line.
# test-server-common/tools/mutation/mutate.py has the details.
#
# A pull request mutates only the crate lines it changes, and the job fails
# if one of those mutants survives or sits on a line no test runs.
# Any other event mutates the whole crate and only reports.
# It uploads mutation-results-<crate> (results.json) for the dashboard's
# Mutation testing page.

name: Rust mutation testing

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label; a CodeBuild label must belong to the calling repository.
        type: string
        required: true
      crate:
        description: The crate to mutate, for example mpl.
        type: string
        required: true
      product:
        description: The commons test server product whose Tests run, for example mpl.
        type: string
        required: true
      server:
        description: <server dir>:<binary>, relative to the repository, for example mpl/test-server:mpl-test-server.
        type: string
        required: true
      commons-ref:
        description: The aws-crypto-tools-commons ref whose Tests and tools run, unless a Test-Server-Override line names another.
        type: string
        default: main
      aws-role-arn:
        description: Role for the Tests that read DynamoDB and KMS. Those Tests fail without it and are left out.
        type: string
        default: ""
    secrets:
      repo-pat:
        description: Read-only token for aws-crypto-tools-commons.
        required: true

jobs:
  mutation:
    name: ${{ inputs.crate }} mutation testing
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      id-token: write
      # The resolve script reads this pull request's Test-Server-Override lines.
      pull-requests: read
    env:
      RUST: ${{ github.workspace }}/rust
      COMMONS: ${{ github.workspace }}/commons
      WORK: ${{ github.workspace }}/mutation-work
    steps:
      - uses: actions/checkout@v6
        with:
          path: rust
          submodules: 'true'
          fetch-depth: 0

      - name: Check out the resolve script
        uses: actions/checkout@v6
        with:
          repository: aws/aws-crypto-tools-commons
          ref: ${{ inputs.commons-ref }}
          token: ${{ secrets.repo-pat }}
          sparse-checkout: .github/scripts
          path: resolve

      - name: Resolve the commons ref, Test-Server-Override lines included
        id: refs
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          INPUT_COMMONS_REF: ${{ inputs.commons-ref }}
          GH_TOKEN: ${{ github.token }}
          REPO_PAT: ${{ secrets.repo-pat }}
        run: resolve/.github/scripts/resolve-test-server-refs.sh resolve

      - uses: actions/checkout@v6
        with:
          repository: aws/aws-crypto-tools-commons
          ref: ${{ steps.refs.outputs.commons_ref }}
          token: ${{ secrets.repo-pat }}
          path: commons

      - name: Mutate the whole crate
        if: github.event_name != 'pull_request'
        run: echo "MUTATE=true" >> "$GITHUB_ENV"

      - name: Mutate only the crate lines this pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CRATE: ${{ inputs.crate }}
        run: |
          git -C rust fetch --no-tags origin "$BASE"
          echo "MUTATION_ARGS=--changed-since $BASE --fail-on-survivors" >> "$GITHUB_ENV"
          if git -C rust diff --quiet "$(git -C rust merge-base "$BASE" HEAD)" -- "$CRATE/src"; then
            echo "This pull request changes nothing in $CRATE/src." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "MUTATE=false" >> "$GITHUB_ENV"
          else
            echo "MUTATE=true" >> "$GITHUB_ENV"
          fi

      - name: Record that there is nothing to mutate
        if: env.MUTATE == 'false'
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          mkdir -p results
          python3 - <<'PY'
          import json, os
          summary = {"repository": os.environ["GITHUB_REPOSITORY"], "commit": os.environ["GITHUB_SHA"],
                     "language": "rust", "library": os.environ["CRATE"], "tool": "mutate.py",
                     "scope": "changed", "mutants": 0, "statuses": {}, "seconds": 0, "phases": {}}
          with open("results/results.json", "w") as f:
              json.dump({"summary": summary, "mutants": []}, f)
          PY

      - name: Install CMake
        if: env.MUTATE == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake

      # The orchestrator builds the Rust server with branch coverage, which
      # needs a nightly compiler.
      - uses: dtolnay/rust-toolchain@master
        if: env.MUTATE == 'true'
        with:
          toolchain: nightly-2026-10-26
          components: llvm-tools-preview

      - name: Use the nightly toolchain for every cargo command below
        if: env.MUTATE == 'true'
        run: echo "RUSTUP_TOOLCHAIN=nightly-2026-10-26" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov and cargo-nextest
        if: env.MUTATE == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Set up JDK 21 for the commons Tests
        if: env.MUTATE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure AWS credentials
        if: env.MUTATE == 'true' && inputs.aws-role-arn != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ inputs.aws-role-arn }}
          role-session-name: RustMutationTesting

      # The mutation tool runs only tests that passed here, on the unmutated crate.
      - name: Record the lines each test server test runs
        if: env.MUTATE == 'true'
        env:
          TESTSERVER_COVERAGE_DIR: ${{ github.workspace }}/coverage/test-server
          TESTSERVER_PER_TEST_COVERAGE: "1"
          RUSTFLAGS: -C instrument-coverage -Z coverage-options=branch --cfg testserver_coverage
          CARGO_TARGET_DIR: ${{ github.workspace }}/target-coverage
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          # A failed Test (for example one that needs AWS) only drops out of the plan.
          make -C "commons/${{ inputs.product }}/test-server" orchestrate \
            ORCHESTRATE_ARGS="languages=rust workingTreeOverlay.aws-crypto-tools-rust=$RUST" || echo "some Tests failed"
          python3 commons/test-server-common/tools/per_test_coverage.py build \
            "$TESTSERVER_COVERAGE_DIR" coverage/out/test-server

      - name: Record the lines each of the crate's own tests runs
        if: env.MUTATE == 'true'
        working-directory: rust/${{ inputs.crate }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: python3 ${{ github.workspace }}/commons/test-server-common/tools/per_test_coverage.py run-test
          PER_TEST_COVERAGE_DIR: ${{ github.workspace }}/coverage/local
          PER_TEST_REPOSITORY: ${{ github.repository }}
          PER_TEST_ROOT: ${{ github.workspace }}/rust
        run: |
          cargo llvm-cov nextest --workspace --no-report --no-fail-fast || echo "some tests failed"
          python3 "$GITHUB_WORKSPACE/commons/test-server-common/tools/per_test_coverage.py" build \
            "$PER_TEST_COVERAGE_DIR" "$GITHUB_WORKSPACE/coverage/out/local"

      - name: Restore earlier mutation results
        if: env.MUTATE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: mutation-cache.json
          key: mutation-${{ inputs.crate }}-${{ github.run_id }}
          restore-keys: mutation-${{ inputs.crate }}-

      - name: Run the mutants
        if: env.MUTATE == 'true'
        env:
          MUTATION_SCHEMATA_TARGET: ${{ github.workspace }}/target-schemata
        run: |
          mkdir -p results
          python3 commons/test-server-common/tools/mutation/mutate.py \
            --repo "$RUST" --repository "${{ github.repository }}" --crates "${{ inputs.crate }}" \
            --server "${{ inputs.server }}" \
            --tests-jvm coverage/test-server/tests-jvm.json \
            --per-test coverage/out/test-server/rust.jsonl,coverage/out/local/rust.jsonl \
            --tests-source "commons/${{ inputs.product }}/test-server/tests,commons/test-server-common/tests-support" \
            --work "$WORK" --cache mutation-cache.json --out results/results.json \
            --library "${{ inputs.crate }}" --servers 4 $MUTATION_ARGS

      - name: Save the mutation results for the next run
        if: always() && env.MUTATE == 'true'
        uses: actions/cache/save@v4
        with:
          path: mutation-cache.json
          key: mutation-${{ inputs.crate }}-${{ github.run_id }}

      - name: Upload the mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results-${{ inputs.crate }}
          path: results/results.json
          if-no-files-found: error
