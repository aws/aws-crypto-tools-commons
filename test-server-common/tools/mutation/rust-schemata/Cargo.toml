[package]
name = "rust-mutant-schemata"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Writes every mutant of a Rust crate into one copy of its source, each behind a runtime switch."

[dependencies]
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
