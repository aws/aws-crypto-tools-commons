[package]
name = "rust-types-scan"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# span-locations gives each item's line number, so the page can link to it.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
