# Versions for the ESDK TestServer orchestrator / runner, kept in lockstep with
# the Java Language_Server (../servers/java) and the single Java `Tests` suite
# (../tests) so client, server, orchestrator, and Tests all speak the identical
# rpcv2Cbor wire contract generated from the one model.
#
# smithy-java 1.4.0 is the current stable release on Maven Central. The server
# runtime (server-core + server-rpcv2-cbor + server-netty) is at the same
# version the server module declares so the in-process launch uses identical
# wiring.
smithyJavaVersion=1.4.0

# Jackson parses the declarative Configuration_Set file
# (config/configuration-set.json). Databind pulls in core + annotations.
jacksonVersion=2.18.2

# jqwik is the established Java property-based testing library used for the
# orchestrator's pure-logic property tests (Properties 11-14). JUnit 5 hosts
# both jqwik and the example/integration tests.
jqwikVersion=1.9.2
junitVersion=5.11.3

# A little more heap for the in-process Netty server + subprocess Gradle test run.
org.gradle.jvmargs=-Xmx2g
