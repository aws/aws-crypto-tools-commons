# Versions for the single ESDK TestServer `Tests` suite (Requirement 7.1),
# kept in lockstep with the generated Java Test_Client (../client-java) and the
# Java Language_Server (hosted in aws-crypto-tools-java at
# esdk/test-server/server) so the client, server, and Tests all speak the
# identical rpcv2Cbor wire contract generated from the one model.
#
# smithy-java 1.4.0 is the current stable release on Maven Central. The client
# runtime (client-core + client-rpcv2-cbor + client-http JDK transport) and the
# server runtime (server-core + server-rpcv2-cbor + server-netty) are all at the
# same version.
smithyJavaVersion=1.4.0

# jqwik is the established Java property-based testing library used for
# Property 1 (blob round-trip); JUnit 5 hosts both jqwik and the example tests.
jqwikVersion=1.9.2
junitVersion=5.11.3

# Run test JVMs with a little more heap; the round-trip generates large blobs.
org.gradle.jvmargs=-Xmx2g
