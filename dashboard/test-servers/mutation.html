<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mutation Testing · Test Server Dashboard</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8b93a7;
    --pass:#2ea043; --part:#d29922; --fail:#da3633; --sel:#388bfd;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--sel); }
  header { display:flex; gap:16px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  input[type=text] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  .run { color:var(--dim); margin-left:auto; font-size:12px; }
  main { padding:16px 20px; }
  h2 { font-size:15px; margin:18px 0 6px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:8px; }
  table { border-collapse:collapse; font-size:12px; }
  th, td { border:1px solid var(--line); padding:5px 9px; }
  thead th { color:var(--dim); font-weight:600; background:var(--bg); }
  .matrix td { text-align:center; min-width:86px; }
  .matrix td b { display:block; font-size:15px; font-variant-numeric:tabular-nums; }
  .matrix td small { color:var(--dim); font-size:10px; }
  .matrix tbody th { text-align:left; }
  /* One look per state. A missing run is calm grey, never red. */
  .st-wait { color:var(--dim); border-style:dotted; }
  .st-token { color:#e3b341; border-style:dotted; }
  .st-loading { color:var(--sel); background:color-mix(in srgb,var(--sel) 12%,transparent); animation:pulse 1.4s ease-in-out infinite; }
  .st-norun { color:var(--dim); background:var(--bg); border-style:dashed; }
  .st-running { color:#e3b341; background:color-mix(in srgb,var(--part) 14%,transparent); }
  .st-error { color:#ffa198; background:color-mix(in srgb,var(--fail) 22%,transparent); cursor:help; }
  .st-empty { color:var(--dim); background:repeating-linear-gradient(45deg,var(--line) 0 4px,transparent 4px 9px); }
  .st-done { background:var(--tint); }
  .st-none { color:var(--dim); background:var(--bg); border-style:dashed; font-style:italic; }
  .st-na { color:var(--dim); background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--line) 60%,transparent) 6px 7px); cursor:help; }
  .st-nopr { color:var(--dim); border-style:dotted; font-style:italic; }
  .st-nothere { color:var(--dim); background:color-mix(in srgb,var(--line) 35%,transparent); }
  .st-nochange { color:var(--dim); background:color-mix(in srgb,var(--sel) 6%,transparent); }
  .st-pass { background:color-mix(in srgb,var(--pass) 35%,transparent); }
  .st-block { background:color-mix(in srgb,var(--fail) 30%,transparent); }
  .scope { display:inline-block; font-size:11px; font-weight:600; padding:1px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }
  .scope.changed { background:color-mix(in srgb,var(--sel) 25%,transparent); color:#a5d6ff; }
  .scope.full { background:color-mix(in srgb,var(--pass) 25%,transparent); color:#7ee787; }
  .runs { font-size:11px; color:var(--dim); margin:4px 0 0; }
  @keyframes pulse { 50% { opacity:.45; } }
  .speed td, .speed th { text-align:right; font-variant-numeric:tabular-nums; }
  .speed td:first-child, .speed th:first-child { text-align:left; }
  .survivors td { vertical-align:top; }
  .survivors td.code { font-family:ui-monospace,monospace; white-space:pre-wrap; }
  .survivors tr.file td { background:var(--panel); font-weight:600; font-family:ui-monospace,monospace; }
  .kind { font-size:10px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin:6px 0; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; border:1px solid var(--line); }
  .quiet { color:var(--dim); padding:24px 0; }
  .good { color:#56d364; }
</style>
</head>
<body>
<header>
  <h1>Mutation Testing</h1>
  <label title="A PR in any library repository, or a commons PR (each repository uses the PR its Test-Server-Override line names), a run URL, or a branch. Fills the 'PR changed lines only' table.">PR / run <input type="text" id="source" size="40" placeholder="a PR, for the changed-lines table"></label>
</header>
<main id="main"><div class="quiet">Loading…</div></main>

<script src="loader.js"></script>
<script>
// Mutation testing results, read in the browser from GitHub Actions.
//
// Each library repository's CI uploads artifacts named mutation-results-*
// holding a results.json (test-server-common/tools/mutation/results.py has its shape).
// summary.scope says what was mutated:
//   changed: a pull request's changed lines; a survivor fails that PR's CI.
//   full: the whole library, on a push to the default branch; reports only.
// The first table reads the PR in the box, the second the newest push to each default branch.

// cells: the library x language cells that each repository's CI fills.
const MUTATION_REPOS = [
  { repo:"aws/aws-crypto-tools-rust", main:"main", cells:[["ESDK","Rust"], ["MPL","Rust"], ["Primitives","Rust"]] },
  { repo:"aws/aws-crypto-tools-java", main:"main", cells:[["MPL","Java"]] },
];
// Cells with no mutation testing on purpose, and why.
const NOT_MUTATED = {};
const LIBRARIES = { esdk:"ESDK", mpl:"MPL", dbesdk:"DB-ESDK", prim:"Primitives" };
const LANGUAGES = { rust:"Rust", java:"Java" };
const SCOPES = { changed:"PR changed lines only", full:"Full library on main" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const secs = s => s >= 3600 ? (s / 3600).toFixed(1) + " h" : s >= 60 ? (s / 60).toFixed(1) + " min" : s.toFixed(s < 10 ? 2 : 0) + " s";
const keyOf = (lib, lang) => lib + "|" + lang;

// cells[scope][library|language] moves from waiting through loading to one end state.
let cells, results, runs, problem;

function reset(text) {
  cells = {}; results = []; runs = { changed:[], full:[] }; problem = null;
  for (const scope of Object.keys(SCOPES)) {
    cells[scope] = {};
    for (const lib of Object.values(LIBRARIES)) for (const lang of Object.values(LANGUAGES)) {
      const key = keyOf(lib, lang);
      cells[scope][key] = NOT_MUTATED[key] ? { state:"na", note:NOT_MUTATED[key] } : { state:"none" };
    }
    for (const { cells: owned } of MUTATION_REPOS)
      for (const [lib, lang] of owned) cells[scope][keyOf(lib, lang)] = scope === "changed" && !text ? { state:"nopr" } : { state:"wait" };
  }
}

function setOwned(entry, scope, cell) {
  for (const [lib, lang] of entry.cells) {
    const current = cells[scope][keyOf(lib, lang)].state;
    if (["wait", "loading", "token"].includes(current)) cells[scope][keyOf(lib, lang)] = cell;
  }
}

// The pull request in this entry's repository that the text names: the PR
// itself, or for a PR elsewhere the one its Test-Server-Override line names.
async function prFor(entry, text) {
  const m = text.match(/^(?:https?:\/\/)?github\.com\/([^/]+\/[^/]+)\/pull\/(\d+)/) || text.match(/^(?:([\w.-]+\/[\w.-]+))?#(\d+)$/);
  if (!m) return null;
  const repo = m[1] || COMMONS;
  const pr = await ghJson(`repos/${repo}/pulls/${m[2]}`);
  if (repo === entry.repo) return pr;
  const named = (pr.body || "").match(new RegExp(entry.repo.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "#(\\d+)"));
  return named ? ghJson(`repos/${entry.repo}/pulls/${named[1]}`) : undefined;
}

// The runs whose mutation artifacts to read, newest first, or null when the text names nothing in this repository.
async function runsFor(entry, text) {
  const all = `repos/${entry.repo}/actions/runs`;
  const id = (text.match(/actions\/runs\/(\d+)/) || text.match(/^(\d+)$/) || [])[1];
  if (id) {
    if (text.includes("github.com") && !text.includes(entry.repo + "/")) return null;
    try { return [await ghJson(`${all}/${id}`)]; } catch (e) { return null; }
  }
  const pr = await prFor(entry, text);
  if (pr === undefined) return null;
  const branch = pr ? pr.head.ref : text;
  const list = pr ? (await ghJson(`${all}?head_sha=${pr.head.sha}&per_page=30`)).workflow_runs : [];
  // A new commit with no run yet falls back to the branch's newest runs.
  return list.length ? list : (await ghJson(`${all}?branch=${encodeURIComponent(branch)}&per_page=30`)).workflow_runs;
}

async function mainRuns(entry) {
  return (await ghJson(`repos/${entry.repo}/actions/runs?branch=${entry.main}&event=push&per_page=30`)).workflow_runs;
}

// Reads the mutation artifacts of the newest runs that have any.
// A finished run without them is skipped; a run still going may add them later.
// Results land in the table of their own scope, so a full run named in the box replaces main's.
async function loadRuns(entry, list, scope) {
  if (!list) { setOwned(entry, scope, { state:"nothere" }); render(); return; }
  if (!list.length) { setOwned(entry, scope, { state:"norun" }); render(); return; }
  setOwned(entry, scope, { state:"loading" });
  render();
  let running = false, found = 0, seen = new Set();
  for (const run of list.slice(0, 10)) {
    const arts = (await ghJson(`repos/${entry.repo}/actions/runs/${run.id}/artifacts?per_page=100`)).artifacts
      .filter(a => a.name.startsWith("mutation-results-") && !a.expired && !seen.has(a.name));
    if (run.status !== "completed") running = true;
    if (!arts.length) continue;
    for (const art of arts) {
      seen.add(art.name);
      try {
        const data = await cachedArtifact(entry.repo, art, () => {}, async (zip, entries) => {
          const file = entries.find(e => e.name.endsWith("results.json"));
          return file ? JSON.parse(await zipText(zip, file)) : null;
        });
        if (!data) continue;
        place(entry, run, data);
        found++;
      } catch (e) {
        setOwned(entry, scope, { state:"error", note:`${art.name}: ${e.message}` });
      }
      render();
    }
    // One run per repository: the newest that has results.
    if (scope === "full") break;
  }
  setOwned(entry, scope, running ? { state:"running" } : found ? { state:"empty" } : { state:"norun" });
  render();
}

function place(entry, run, data) {
  const s = data.summary;
  const scope = s.scope || (s.flags && s.flags.changed_since ? "changed" : "full");
  const lib = LIBRARIES[s.library || (s.crates || [])[0]] || s.library;
  const lang = LANGUAGES[s.language || "rust"] || s.language;
  if (!cells[scope][keyOf(lib, lang)] || results.some(r => r.scope === scope && r.lib === lib && r.lang === lang)) return;
  if (!runs[scope].some(r => r.run.id === run.id)) runs[scope].push({ repo:entry.repo, run });
  const st = data.mutants.reduce((counts, m) => (counts[m.status] = (counts[m.status] || 0) + 1, counts), {});
  const killed = (st.killed || 0) + (st.timed_out || 0);
  cells[scope][keyOf(lib, lang)] = { state:"done", killed, survived:st.survived || 0, notCovered:st.not_covered || 0, scope };
  results.push({ lib, lang, repo:entry.repo, run, scope, data });
}

async function load() {
  const text = $("source").value.trim();
  reset(text);
  if (!token()) {
    problem = "Add a GitHub token on the main dashboard's Settings page to load mutation runs.";
    for (const scope of Object.keys(SCOPES)) for (const key of Object.keys(cells[scope]))
      if (cells[scope][key].state === "wait") cells[scope][key] = { state:"token" };
    render();
    return;
  }
  render();
  await Promise.all(MUTATION_REPOS.map(async entry => {
    if (text) {
      try {
        await loadRuns(entry, await runsFor(entry, text), "changed");
      } catch (e) { setOwned(entry, "changed", { state:"error", note:e.message }); render(); }
    }
    try {
      await loadRuns(entry, await mainRuns(entry), "full");
    } catch (e) { setOwned(entry, "full", { state:"error", note:e.message }); render(); }
  }));
  render();
}

function matrixCell(cell) {
  switch (cell.state) {
    case "wait": return `<td class="st-wait">waiting</td>`;
    case "token": return `<td class="st-token">needs a token</td>`;
    case "loading": return `<td class="st-loading">loading…</td>`;
    case "nopr": return `<td class="st-nopr">enter a PR</td>`;
    case "nothere": return `<td class="st-nothere" title="The PR names no pull request in this repository in its Test-Server-Override line">not in this PR</td>`;
    case "norun": return `<td class="st-norun">no run yet</td>`;
    case "none": return `<td class="st-none">not set up</td>`;
    case "na": return `<td class="st-na" title="${esc(cell.note)}">not mutated</td>`;
    case "running": return `<td class="st-running">running</td>`;
    case "empty": return `<td class="st-empty">no results</td>`;
    case "error": return `<td class="st-error" title="${esc(cell.note)}">failed to load</td>`;
  }
  const tested = cell.killed + cell.survived;
  const title = `${cell.killed} killed, ${cell.survived} survived, ${cell.notCovered} on lines no test runs`;
  const rate = tested ? Math.round(cell.killed / tested * 100) + "%" : "–";
  if (cell.scope === "changed") {
    if (!tested && !cell.notCovered) return `<td class="st-nochange" title="No mutant on a library line this PR changes">no changed lines</td>`;
    const blocking = cell.survived + cell.notCovered;
    return blocking
      ? `<td class="st-block" title="${title}"><b>${rate}</b><small>${cell.survived} survived · ${cell.notCovered} not covered · blocks merge</small></td>`
      : `<td class="st-pass" title="${title}"><b>${rate}</b><small>all ${cell.killed} killed</small></td>`;
  }
  const tint = `color-mix(in srgb,var(--pass) ${Math.round(10 + (tested ? cell.killed / tested : 1) * 40)}%,transparent)`;
  return `<td class="st-done" style="--tint:${tint}" title="${title}"><b>${rate}</b><small>${cell.survived} survived · ${cell.notCovered} not covered</small></td>`;
}

function matrix(scope) {
  let h = `<h2>${SCOPES[scope]}<span class="scope ${scope}">${scope === "changed" ? "blocks the PR" : "reports only"}</span></h2>`;
  h += `<table class="matrix"><thead><tr><th></th>${Object.values(LANGUAGES).map(l => `<th>${l}</th>`).join("")}</tr></thead><tbody>`;
  for (const lib of Object.values(LIBRARIES))
    h += `<tr><th>${lib}</th>${Object.values(LANGUAGES).map(lang => matrixCell(cells[scope][keyOf(lib, lang)])).join("")}</tr>`;
  h += `</tbody></table>`;
  if (runs[scope].length)
    h += `<div class="runs">${runs[scope].map(({ repo, run }) => `<a href="${run.html_url}" target="_blank">${esc(repo.replace("aws/", ""))} run ${run.id}</a> (${esc(run.head_branch)} ${run.head_sha.slice(0, 7)}, ${esc(run.status === "completed" ? run.conclusion : run.status)})`).join(" · ")}</div>`;
  return h;
}

function mutantTable(title, mutants, repo, commit) {
  let h = `<h3 style="font-size:13px;margin:10px 0 4px">${title} (${mutants.length})</h3>`;
  h += `<table class="survivors"><thead><tr><th>line</th><th>mutation</th><th>code</th><th>function</th></tr></thead><tbody>`;
  let file = null;
  for (const m of mutants.sort((a, b) => a.file.localeCompare(b.file) || a.line - b.line)) {
    if (m.file !== file) { file = m.file; h += `<tr class="file"><td colspan="4">${esc(file)}</td></tr>`; }
    const link = `https://github.com/${repo}/blob/${commit || "HEAD"}/${m.file}#L${m.line}`;
    h += `<tr><td><a href="${link}" target="_blank">${m.line}</a></td><td><span class="kind">${esc(m.kind || "")}</span> ${esc(m.description || "")}</td><td class="code">${esc(m.source_line || "")}</td><td>${esc(m.function || "")}</td></tr>`;
  }
  return h + `</tbody></table>`;
}

function render() {
  let h = problem ? `<div class="quiet">${esc(problem)}</div>` : "";
  h += `<div class="sub">Kill rate: of the mutants on lines a test runs, the share that some test fails on. A mutant on a line no test runs is "not covered"; on a PR it blocks the merge too.</div>`;
  h += matrix("changed") + matrix("full");
  h += `<div class="legend">
    <span><i class="sw st-pass"></i>PR: every mutant killed</span>
    <span><i class="sw st-block"></i>PR: a mutant survived or is not covered</span>
    <span><i class="sw st-nochange"></i>PR changes no library line</span>
    <span><i class="sw" style="background:color-mix(in srgb,var(--pass) 45%,transparent)"></i>main: brighter is more killed</span>
    <span><i class="sw st-norun"></i>no run yet</span>
    <span><i class="sw st-nopr"></i>no PR entered</span>
    <span><i class="sw st-nothere"></i>the PR does not touch this repository</span>
    <span><i class="sw st-none"></i>not set up for this language</span>
    <span><i class="sw st-na"></i>not mutated on purpose</span>
    <span><i class="sw st-empty"></i>run finished without results</span>
    <span><i class="sw st-running"></i>run still going</span>
    <span><i class="sw st-error"></i>could not load</span></div>`;

  for (const { lib, lang, repo, run, scope, data } of results) {
    const s = data.summary;
    const counts = data.mutants.reduce((c, m) => (c[m.status] = (c[m.status] || 0) + 1, c), {});
    h += `<h2>${lib} · ${lang}<span class="scope ${scope}">${SCOPES[scope]}</span></h2>`;
    h += `<div class="sub">${data.mutants.length} mutants by ${esc(s.tool || "mutate.py")} in <a href="${run.html_url}" target="_blank">run ${run.id}</a>: ${Object.entries(counts).map(([k, v]) => `${v} ${esc(k.replace("_", " "))}`).join(", ") || "none"}.</div>`;
    if (s.seconds !== undefined) {
      h += `<table class="speed"><thead><tr><th>step</th><th>time</th></tr></thead><tbody>`;
      for (const [phase, t] of Object.entries(s.phases || {})) h += `<tr><td>${esc(phase)}</td><td>${secs(t)}</td></tr>`;
      h += `<tr><th>total</th><th>${secs(s.seconds)}</th></tr></tbody></table>`;
    }
    const survivors = data.mutants.filter(m => m.status === "survived");
    const uncovered = data.mutants.filter(m => m.status === "not_covered");
    if (!survivors.length && !uncovered.length) { h += `<div class="quiet good">Every mutant was killed.</div>`; continue; }
    if (survivors.length) h += mutantTable("Survived", survivors, repo, s.commit);
    if (uncovered.length) h += mutantTable("Not covered: no test runs the line", uncovered, repo, s.commit);
  }
  $("main").innerHTML = h;
}

// The PR box is shared with the other test server pages.
$("source").value = readSource();
$("source").addEventListener("change", e => { writeSource(e.target.value.trim()); load(); });
load();
</script>
</body>
</html>
