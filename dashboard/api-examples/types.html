<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Types</title>
<style>
  /* The same colors and layout as the other dashboard pages, like test-servers/index.html. */
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8b93a7;
    --pass:#2ea043; --part:#d29922; --more:#db6d28; --fail:#da3633; --none:#3a3f4b; --sel:#388bfd; --prop:#a371f7; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  a { color:var(--sel); }
  code, pre { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { display:flex; gap:12px 16px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; flex:none; }
  header h1 { font-size:16px; margin:0 4px 0 0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button, .tool { background:var(--bg); color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:4px 12px; cursor:pointer; font:inherit; font-size:13px; }
  .tabs button:hover, .tool:hover { color:var(--text); }
  .tabs button.on, .tool.on { color:var(--text); border-color:var(--sel); }
  .tool:disabled { opacity:.5; cursor:default; }
  .run { color:var(--dim); margin-left:auto; font-size:12px; }
  main { flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); }
  main.open { grid-template-columns:minmax(0,var(--left,1.4fr)) 6px minmax(0,1fr); }
  main:not(.open) #divider, main:not(.open) #detail { display:none; }
  section { overflow:auto; padding:16px 20px; }
  #detail { background:var(--panel); }
  #detail .close { position:sticky; top:0; float:right; background:var(--bg); color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:2px 9px; cursor:pointer; font-size:14px; }
  #detail .close:hover { color:var(--text); border-color:var(--sel); }
  #detail h2 { margin:0 0 4px; font-size:16px; font-family:ui-monospace, monospace; }
  #detail h3 { font-size:13px; margin:16px 0 6px; }
  #detail ul { margin:4px 0; padding-left:18px; }
  #detail li { margin:3px 0; }
  #detail pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:4px 0; font-size:12px; white-space:pre-wrap; }
  #detail .quote { color:var(--text); }
  #divider { cursor:col-resize; background:var(--line); }
  #divider:hover, #divider.drag { background:var(--sel); }
  body.resizing { user-select:none; cursor:col-resize; }
  .sub { color:var(--dim); font-size:12px; margin:0 0 10px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-bottom:8px; }
  .legend span { display:flex; align-items:center; gap:5px; }
  .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }
  table { border-collapse:collapse; width:100%; margin-bottom:14px; }
  th, td { border:1px solid var(--line); padding:6px 8px; vertical-align:top; text-align:left; }
  thead th, tr.head th { font-weight:600; font-size:12px; position:sticky; top:-16px; background:var(--bg); z-index:1; }
  td.opt { white-space:nowrap; width:1%; }
  td.opt b { font-family:ui-monospace, monospace; font-size:13px; }
  td.opt div { color:var(--dim); font-family:ui-monospace, monospace; font-size:11px; }
  td.none { color:var(--dim); font-style:italic; }
  /* A chip is one type. Its color is the number of calls the type needs. */
  .chip { display:inline-block; margin:2px; padding:1px 8px; border-radius:8px; font-family:ui-monospace, monospace; font-size:12px; cursor:pointer; border:1px solid var(--line); background:var(--bg); white-space:nowrap; }
  .chip:hover { border-color:var(--sel); }
  .chip.sel { outline:2px solid #fff; outline-offset:-1px; }
  .b0 { background:color-mix(in srgb,var(--pass) 35%,transparent); }
  .b1 { background:color-mix(in srgb,var(--part) 35%,transparent); }
  .b2 { background:color-mix(in srgb,var(--more) 40%,transparent); }
  .bx { color:var(--dim); border-style:dashed; }
  .warn { border-color:var(--fail); color:#ffa198; }
  .failed { text-decoration:line-through; }
  td.ck { text-align:center; cursor:pointer; }
  td.ck small { display:block; color:var(--dim); font-family:ui-monospace, monospace; font-size:10px; }
  td.kind { cursor:pointer; white-space:nowrap; }
  td.kind:hover { color:var(--sel); }
  tr.detail td { background:var(--panel); }
  tr.detail .lang { font-weight:600; font-size:11px; color:var(--dim); margin-bottom:2px; }
  .ev { font-size:11px; color:var(--dim); }
  .prop { margin-top:4px; border:1px solid var(--prop); background:transparent; color:var(--prop); border-radius:8px; padding:1px 8px; font-size:11px; cursor:pointer; font:inherit; font-size:11px; }
  .prop.on { background:color-mix(in srgb,var(--prop) 35%,transparent); color:var(--text); }
  .propsig { margin-top:3px; color:var(--prop); font-family:ui-monospace, monospace; font-size:11px; white-space:normal; max-width:260px; }
  .why { margin-top:2px; color:var(--dim); font-size:11px; white-space:normal; max-width:260px; }
  .breaks { margin-top:2px; color:#ffa198; font-family:ui-monospace, monospace; font-size:11px; white-space:normal; max-width:260px; }
  label.tool input { display:none; }
  details { margin:2px 0; }
  details > summary { cursor:pointer; padding:3px 6px; border-radius:4px; list-style:none; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::before { content:"▸ "; color:var(--dim); }
  details[open] > summary::before { content:"▾ "; }
  details > summary:hover { background:var(--panel); }
  .hits { margin:4px 0 8px 18px; }
  .hits code { font-size:11px; background:var(--panel); border:1px solid var(--line); padding:0 4px; border-radius:4px; }
  .hits .where { font-size:11px; }
  .hits .source { margin-bottom:8px; }
  .tag { font-size:10px; border:1px solid var(--line); border-radius:8px; padding:0 6px; color:var(--dim); }
  .grp { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; margin:0 2px 0 10px; align-self:center; }
  .grp:first-child { margin-left:0; }
  .cust { display:inline-block; padding:1px 8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:12px; cursor:pointer; white-space:nowrap; }
  .cust:hover { border-color:var(--sel); }
  .cust.sel { outline:2px solid #fff; outline-offset:-1px; }
  th .cust { margin-top:4px; font-weight:400; }
  #detail ol { margin:4px 0; padding-left:20px; } #detail ol li { margin:6px 0; }
</style>
</head>
<body>
<header>
  <h1>Types</h1>
  <div class="tabs" id="apis"></div>
  <div class="tabs" id="langs"></div>
  <span class="run" id="run"></span>
  <button class="tool" id="how">How it's made</button>
</header>
<main id="main">
  <section id="left">
    <div class="legend">
      <span><i class="sw b0"></i>as is</span>
      <span><i class="sw b1"></i>one call</span>
      <span><i class="sw b2"></i>&gt;1 call</span>
      <span><i class="sw bx" style="border:1px dashed var(--line)"></i>no fix found</span>
      <span><i class="sw" style="border:1px solid var(--fail)"></i>⚠ risky, or breaks a rule</span>
      <span>✗ compiles, but the run fails</span>
      <span style="color:var(--prop)">▲ ▼ moved by a proposal</span>
    </div>
    <p class="sub">Each row is one option. Each chip is a type a customer may hold, under the number of calls it takes to pass. Hover a chip for what it is, or click it for its code and checks.</p>
    <div id="view"></div>
    <p class="sub" id="foot"></p>
  </section>
  <div id="divider" title="Drag to resize. Double-click to reset."></div>
  <section id="detail"></section>
</main>
<script>
// The page draws four files from this folder:
//   types.json        Rust rows from compile_rust_types.py, which compiles each held type on each option and runs the
//                     call that compiled. Other languages' rows from other_languages.py, not compiled. "about" says
//                     what each type is, and, for Rust, where a customer gets one.
//   usage.json        how public customer code calls each option, from api-examples/usage_search.py.
//   expectations.json rules a person wrote for what an option should not take as is.
//   proposals.json    proposed signatures, when the api-signature-proposals skill ran here. Optional.
// A row is {type, calls, code, kind}. calls counts the calls in the code (calls.py), or is null when nothing compiled.
// A Rust row also has trial (its line in rust_trials.rs), test (its line in rust_runs.rs) and run (what the test found).
const LANGS = [["Rust", "rust"], ["Java", "java"], ["Python", "python"], [".NET", "dotnet"], ["Go", "go"], ["JS", "javascript"]];
const KINDS = ["bytes", "text", "pairs", "base64 text", "hex text", "file / stream", "map", "list", "number", "Duration",
  "the type itself", "what builds it", "your config", "other"];
// Rust kinds under the comparison's rows. Optional values have no row, because the other languages take null instead.
const RUST_KIND = { bytes: "bytes", text: "text", pair: "pairs", path: "file / stream", reader: "file / stream",
  stream: "file / stream", number: "number", duration: "Duration", list: "list", map: "map",
  named: "the type itself", component: "the type itself", ctor: "what builds it" };
// What a customer had before a conversion, as usage.json says it, and the row it goes under.
const FROM_KIND = { "a string": "text", "a &str": "text", "a file": "file / stream", "a file or stream": "file / stream",
  "base64 text": "base64 text", "hex text": "hex text", "your config": "your config", "a byte array": "bytes",
  "a byte slice": "bytes", "separate values": "list", "key/value pairs": "pairs",
  "a value that is not a string": "other", "a value that converts with into()": "other" };
const LEVEL = { 0: "as is", 1: "one call", 2: ">1 call", x: "no fix found" };
const COMMONS = "https://github.com/aws/aws-crypto-tools-commons";
// Links go to this branch of commons. Open the page with ?ref=<branch> to link a branch other than main.
const REF = new URLSearchParams(location.search).get("ref") || "main";
let data = null, usage = null, expectations = { rules: {} }, proposals = null;
let api = 0, lang = "rust";
const proposed = new Set();
const opened = new Set();     // option|kind rows that are open in the comparison
const openDetails = new Set(); // customer lists that are open
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// Doc text keeps its `code` spans.
const docHtml = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const level = calls => calls === null || calls === undefined ? "x" : Math.min(calls, 2);
const option = key => key.split(".")[1];
const blob = (file, line) => `${COMMONS}/blob/${REF.split("/").map(encodeURIComponent).join("/")}/${file}#L${line}`;
const ciLink = () => `${COMMONS}/actions/workflows/api-examples-types.yml?query=${encodeURIComponent("branch:" + REF)}`;
const langName = l => LANGS.find(x => x[1] === l)[0];

const proposalOf = key => ((proposals || {}).options || {})[key];
const proposalFor = (key, l) => ((proposalOf(key) || {}).languages || {})[l];
const hasProposal = key => Object.keys((proposalOf(key) || {}).languages || {}).length > 0;
const rawRows = (key, l) => (l === "rust" ? data.rust[key] : ((data.others || {})[key] || {})[l]) || [];
const rowsOf = (key, l) => (proposed.has(key) && proposalFor(key, l) ? proposalFor(key, l).rows : rawRows(key, l));
const kindOf = (row, l) => l === "rust" ? RUST_KIND[row.kind] : row.kind;
const takesOf = (key, l) => l === "rust" ? data.takes[key] : ((data.shipped[key] || {})[l] || []).join(", ");
const aboutOf = (l, type) => ((data.about || {})[l] || {})[type];

// A rule from expectations.json, checked against one row: ok is false when the row takes a refused kind as is.
function expected(key, row) {
  const rule = (expectations.rules || {})[key];
  if (!rule || !rule.refuse.includes(row.kind) || row.calls === null || row.calls === undefined) return null;
  return row.calls === 0
    ? { ok: false, text: `Takes ${row.kind} as is, which the rule refuses. ${rule.why}` }
    : { ok: true, text: `Needs a conversion, as the rule asks. ${rule.why}` };
}

// Calls that compile but are likely mistakes.
function risk(row) {
  return row.type === "char" && row.calls === 0 ? "A single char compiles." : "";
}

// Whether a Rust row's run failed: the build or call returned an error, or the result differs from the reference.
const runFailed = row => !!(row.run && !row.run.skipped && (row.run.builds === false || row.run.same === false));

// ▲ marks a row the proposal makes cheaper, and ▼ one it makes dearer.
function moved(row) {
  if (!("today" in row) || level(row.calls) === level(row.today)) return "";
  return row.today === null || (row.calls !== null && row.calls < row.today) ? " ▲" : " ▼";
}

// A chip's hover text: what each part of its type is, and what it took before a proposal.
function hoverText(l, row) {
  const about = aboutOf(l, row.type);
  const lines = about ? about.parts.filter(p => p.text).map(p => `${p.name}: ${p.text}`) : [];
  if ("today" in row) lines.push(`Was ${LEVEL[level(row.today)]}.`);
  return lines.join("\n");
}

function chip(key, l, row, text) {
  const rule = expected(key, row);
  const warn = (rule && !rule.ok) || risk(row);
  const failed = runFailed(row);
  const hover = hoverText(l, row);
  return `<span class="chip b${level(row.calls)}${warn ? " warn" : ""}${failed ? " failed" : ""}"${hover ? ` title="${esc(hover)}"` : ""} `
    + `data-key="${esc(key)}" data-lang="${l}" data-type="${esc(row.type)}">${esc(text)}${warn ? " ⚠" : ""}${failed ? " ✗" : ""}${moved(row)}</span>`;
}

function propButton(key) {
  const on = proposed.has(key);
  return `<button class="prop${on ? " on" : ""}" data-prop="${esc(key)}">${on ? "Proposed ▾" : "Proposed ▸"}</button>`;
}

// The option cell: its name, what it takes, and the proposal button and text.
function optionCell(key, takes) {
  const p = proposalOf(key);
  let html = `<td class="opt"><b>${esc(option(key))}</b><div>${esc(takes || "not offered")}</div>`;
  if (!p) return html + "</td>";
  if (!hasProposal(key)) return html + `<div class="why">No proposal. ${esc(p.why)}</div></td>`;
  html += propButton(key);
  if (proposed.has(key)) {
    const mine = proposalFor(key, lang);
    html += `<div class="propsig">${esc(mine ? mine.signature : "no change")}</div><div class="why">${esc(p.why)}</div>`;
    for (const b of (mine && mine.breaks) || []) html += `<div class="breaks">Breaks ${esc(b)}</div>`;
  }
  return html + "</td>";
}

function mapView() {
  const levels = [0, 1, 2, "x"];
  let html = "<table><thead><tr><th>Option · takes</th>" + levels.map(l => `<th>${esc(LEVEL[l][0].toUpperCase() + LEVEL[l].slice(1))}</th>`).join("") + "</tr></thead><tbody>";
  for (const key of data.apis[api].options) {
    const takes = takesOf(key, lang);
    html += "<tr>" + optionCell(key, takes);
    if (!takes) {
      html += `<td class="none" colspan="${levels.length}">Not offered</td></tr>`;
      continue;
    }
    const cells = { 0: "", 1: "", 2: "", x: "" };
    for (const row of rowsOf(key, lang)) cells[level(row.calls)] += chip(key, lang, row, row.type);
    html += levels.map(l => `<td>${cells[l]}</td>`).join("") + "</tr>";
  }
  return html + "</tbody></table>";
}

// The cheaper of two rows. A row with no fix found loses.
const cheaper = (a, b) => !b || (a.calls !== null && (b.calls === null || a.calls < b.calls));

// usage.json's conversions for one option, each with the row it goes under.
function conversions(key) {
  const [apiKey, name] = (data.usage_keys || {})[key] || [];
  const list = (((usage || {}).apis || {})[apiKey] || {})[name] || [];
  return list.map(c => ({ ...c, kind: c.from === null ? "passed as is" : FROM_KIND[c.from] || "other" }));
}

// A customer cell: how many sources had this kind of value, and a click opens them in the side pane.
function custCell(key, kind, convs, words) {
  const sources = convs.reduce((n, c) => n + c.sources, 0);
  if (!sources) return "";
  return `<span class="cust" data-cust="${esc(key)}|${esc(kind)}" title="Click to see each call and where it is">${sources} ${sources === 1 ? "source" : "sources"}${words}</span>`;
}

function compareView() {
  let html = "";
  for (const key of data.apis[api].options) {
    const all = {}, best = {};
    for (const [, l] of LANGS) {
      for (const row of rowsOf(key, l)) {
        const kind = kindOf(row, l);
        if (!kind) continue;
        ((all[kind] = all[kind] || {})[l] = all[kind][l] || []).push(row);
        best[kind] = best[kind] || {};
        if (cheaper(row, best[kind][l])) best[kind][l] = row;
      }
    }
    const convs = customerKinds(key, all);
    const on = proposed.has(key);
    const button = hasProposal(key) ? " " + propButton(key) : "";
    const sig = on && proposalFor(key, "rust") ? `<div class="propsig">${esc(proposalFor(key, "rust").signature)}</div>` : "";
    const asIs = custCell(key, "passed as is", convs.filter(c => c.kind === "passed as is"), " pass it as is");
    html += `<table><tr class="head"><th>${esc(option(key))}${button}${sig}${asIs ? `<div>${asIs}</div>` : ""}</th>`
      + LANGS.map(l => `<th>${l[0]}</th>`).join("") + `<th title="Public GitHub code that has this kind of value and converts it before the call">Customers</th></tr>`;
    for (const kind of KINDS.filter(k => all[k] || (k === "other" && convs.some(c => c.kind === "other")))) {
      const id = `${key}|${kind}`;
      const isOpen = opened.has(id);
      html += `<tr data-open="${esc(id)}"><td class="kind">${isOpen ? "▾" : "▸"} ${esc(kind)}</td>`;
      for (const [, l] of LANGS) {
        const row = (best[kind] || {})[l];
        const n = ((all[kind] || {})[l] || []).length;
        const more = n > 1 ? ` +${n - 1}` : "";
        const none = !takesOf(key, l) ? (l === "rust" || (data.others || {})[key] ? "not offered" : "no data yet") : "";
        html += `<td class="ck">${row ? chip(key, l, row, LEVEL[level(row.calls)]) + `<small>${esc(row.type)}${more}</small>` : `<small>${none}</small>`}</td>`;
      }
      html += `<td>${custCell(key, kind, convs.filter(c => c.kind === kind), "")}</td></tr>`;
      if (isOpen) html += detailRow(key, kind, all[kind] || {});
    }
    html += "</table>";
  }
  if (!usage) html += `<p class="sub">usage.json didn't load, so customer counts are hidden.</p>`;
  return html;
}

// usage.json's conversions for an option, each under a row of the table. One whose kind has no row goes under other.
function customerKinds(key, rows) {
  return conversions(key).map(c => c.kind === "passed as is" || rows[c.kind] ? c : { ...c, kind: "other" });
}

// Every type of one kind in each language.
function detailRow(key, kind, byLang) {
  let html = `<tr class="detail"><td></td>`;
  for (const [name, l] of LANGS) {
    const rows = (byLang[l] || []).slice().sort((a, b) => (a.calls === null) - (b.calls === null) || (a.calls || 0) - (b.calls || 0));
    html += `<td><div class="lang">${name}</div>${rows.map(r => chip(key, l, r, r.type)).join("<br>") || "<span class=\"ev\">none</span>"}</td>`;
  }
  return html + "<td></td></tr>";
}

// The side pane for one customer cell: each call that converts this kind of value, and every place it is,
// grouped by source.
function showCustomers(key, kind) {
  const convs = customerKinds(key, Object.fromEntries(KINDS.map(k => [k, true]))).filter(c => c.kind === kind)
    .sort((a, b) => b.sources - a.sources);
  const sources = convs.reduce((n, c) => n + c.sources, 0), hits = convs.reduce((n, c) => n + c.count, 0);
  const who = kind === "passed as is" ? "pass the value as is" : `have ${kind}, and convert it before the call`;
  let html = `<button class="close" data-close title="Close">×</button><h2>${esc(option(key))}</h2>`
    + `<div class="sub">Customers who ${esc(who)} · ${sources} sources · ${hits} hits</div>`
    + `<p class="sub">${esc((usage.search || {}).sources || "")} Copies of AWS code are listed, but not counted.</p><h3>What they call</h3>`;
  for (const c of convs) {
    const id = `${key}|${c.conversion}`;
    const langs = Object.entries(c.languages).map(([l, n]) => `${l} ${n}`).join(", ");
    const copies = c.aws_copies ? `, plus ${c.aws_copies} in copies of AWS code` : "";
    html += `<details data-id="${esc(id)}"${openDetails.has(id) ? " open" : ""}><summary><code>${esc(c.conversion)}</code>`
      + ` <span class="ev">from ${esc(c.from || "the same type")} · ${c.sources} sources · ${c.count} hits in ${c.repos} repos (${esc(langs)})${copies}</span></summary>`
      + `<div class="hits">${hitList(c.hits || [])}</div></details>`;
  }
  $("detail").innerHTML = html;
  $("main").classList.add("open");
}

const hitLink = h => `<a href="${esc(h.url)}" target="_blank">${esc(h.repo)}/${esc(h.path)}#L${h.line}</a>`;

// Every hit, grouped by source. Each line of code shows once, above every place it appears.
function hitList(hits) {
  const groups = {};
  for (const h of hits.filter(h => !h.aws_copy)) (groups[h.source] = groups[h.source] || []).push(h);
  let html = Object.values(groups).map(group => {
    const files = new Set(group.map(h => `${h.repo}/${h.path}`)).size;
    const tag = files > 1 ? `${files} copies` : group.length > 1 ? `${group.length} calls in one file` : "";
    const lines = {};
    for (const h of group) {
      const id = `${h.code}\n${h.assignment}`;
      (lines[id] = lines[id] || []).push(h);
    }
    const body = Object.values(lines).map(same => {
      const via = same[0].assignment ? `<br><code>${esc(same[0].assignment)}</code>` : "";
      return `<div><code>${esc(same[0].code || "")}</code>${via}<div class="where">${same.map(hitLink).join("<br>")}</div></div>`;
    }).join("");
    return `<div class="source">${tag ? `<span class="tag">${tag}</span>` : ""}${body}</div>`;
  }).join("");
  const aws = hits.filter(h => h.aws_copy);
  if (aws.length) {
    html += `<div class="ev">Copies of AWS code, not counted:</div><div class="where">${aws.map(hitLink).join("<br>")}</div>`;
  }
  return html;
}

// What the run test found, in words.
function runText(run) {
  if (run.skipped) return `⏭ Not run: ${run.skipped}.`;
  if (!run.builds) return `❌ Ran: it failed with ${run.error || "an error"}.`;
  let text = "✅ Ran: it works";
  if (run.same === true) text += ", and gives the same result as the reference value";
  if (run.same === false) text = "❌ Ran: it works, but the result differs from the reference value";
  if (run.copies === true) text += ". Passing the value copies it";
  if (run.copies === false) text += ". Passing the value doesn't copy it";
  return text + ".";
}

// What a type is, part by part, and for Rust, where a customer gets one.
function aboutHtml(l, type) {
  const about = aboutOf(l, type);
  if (!about) return "";
  let html = "<h3>What it is</h3><ul>" + about.parts.map(p => {
    const text = p.text ? (p.from ? `<span class="quote">“${docHtml(p.text)}”</span>` : esc(p.text)) : `<span class="ev">No doc comment.</span>`;
    const link = p.url ? ` <a href="${esc(p.url)}" target="_blank">${p.from ? `${esc(p.from)} source ↗` : "docs ↗"}</a>` : "";
    return `<li><code>${esc(p.name)}</code> ${text}${link}</li>`;
  }).join("") + "</ul>";
  const held = about.held;
  if (held) {
    html += `<h3>Where a customer gets one</h3><p class="sub">${esc(held.text)}${held.examples.length ? " Some of them:" : ""}</p><ul>`
      + held.examples.map(e => `<li>${esc(e.crate)}: <a href="${esc(e.url)}" target="_blank"><code>${esc(e.item)}${e.pos === "return" ? "()" : ""}</code></a> `
        + `${e.pos === "return" ? "returns one" : "is one"}</li>`).join("") + "</ul>";
    if (held.why) html += `<p class="sub">It counts as this kind because ${docHtml(held.why.charAt(0).toLowerCase() + held.why.slice(1))}</p>`;
  } else if (l !== "rust") {
    html += `<p class="sub">Picked by hand for this page.</p>`;
  }
  return html;
}

function show(key, l, type) {
  const row = rowsOf(key, l).find(r => r.type === type);
  // A pair row stands for two values: x and y in Rust, k and v in the other languages.
  const pair = row.kind === "pair" || row.kind === "pairs";
  const held = pair ? `${l === "rust" ? "x, y" : "k, v"}: ${type.slice(1, -1).split(", ")[0]}` : `x: ${type}`;
  const checks = [];
  let code = "No fix in the list works.";
  if (row.calls !== null && row.calls !== undefined) {
    code = l === "rust" ? data.apis[api].call + row.code : row.code;
    checks.push(`${LEVEL[level(row.calls)]}: ${row.calls} ${row.calls === 1 ? "call" : "calls"}.`);
  }
  if (row.proposed) {
    const checked = l === "rust" ? "Compiled against a model of it, not run" : "Not compiled";
    checks.push(`✏️ Proposed: <code>${esc(proposalFor(key, l).signature)}</code>. ${checked}. Today: ${LEVEL[level(row.today)]}.`);
  } else if (l === "rust") {
    if (row.trial) checks.push(`✅ Compiled. <a href="${blob(data.files.trials, row.trial)}" target="_blank">See the code it compiled ↗</a>`);
    else checks.push("❌ No fix in the list compiled.");
    if (row.run) checks.push(`${esc(runText(row.run))} <a href="${blob(data.files.runs, row.test)}" target="_blank">See the test ↗</a>`);
    checks.push(`<a href="${ciLink()}" target="_blank">CI compiles and runs these again ↗</a> on aws-crypto-tools-rust at `
      + `<a href="https://github.com/aws/aws-crypto-tools-rust/tree/${data.rust_commit}" target="_blank">${data.rust_commit.slice(0, 7)}</a>`
      + ` with rustc ${esc(data.rustc)}.`);
  } else {
    checks.push("⚙ Written from the release's signature. Not compiled or run.");
  }
  const rule = expected(key, row);
  if (rule) checks.push(`${rule.ok ? "✅" : "⚠"} Rule: ${esc(rule.text)}`);
  if (risk(row)) checks.push(`⚠ ${esc(risk(row))}`);
  $("detail").innerHTML = `<button class="close" data-close title="Close">×</button><h2>${esc(type)}</h2>`
    + `<div class="sub">${esc(langName(l))} · ${esc(option(key))} · ${esc(held)}</div>`
    + aboutHtml(l, type)
    + `<h3>Code</h3><pre>${esc(code)}</pre><h3>Checks</h3><ul>${checks.map(c => `<li>${c}</li>`).join("")}</ul>`;
  $("main").classList.add("open");
}

// How each part of this page is made.
function howItsMade() {
  const file = (path, name) => `<a href="${COMMONS}/blob/${REF.split("/").map(encodeURIComponent).join("/")}/${path}" target="_blank"><code>${name || path.split("/").pop()}</code></a>`;
  const t = "api-examples/types/";
  return `<button class="close" data-close title="Close">×</button><h2>How this page is made</h2>`
    + `<div class="sub">Scripts make every number here. A person only wrote the rules and picked the fixes to try.</div><ol>`
    + `<li><b>The API.</b> ${file(t + "rust_api.py")} reads every keyring, CMM, key store, cache and client, and each of their setters, from rustdoc. It writes ${file(t + "rust-api.json")}.</li>`
    + `<li><b>The types.</b> ${file(t + "rust_types.py")} reads the public code of 174 popular crates. It lists the types they hand out, like <code>String</code> or <code>Bytes</code>, in ${file(t + "rust-types.json")}.</li>`
    + `<li><b>The checks.</b> ${file(t + "compile_rust_types.py")} writes one small function for each setter, type and fix, like <code>x.as_bytes()</code>, in ${file(t + "rust_trials.rs")}. The Rust compiler says which ones compile. Each cell is the fix with the fewest calls that compiled. Then it runs that call for some options, in ${file(t + "rust_runs.rs")}.</li>`
    + `<li><b>Other languages.</b> ${file(t + "other_languages.py")} writes each call from the released library's signatures. These are not compiled.</li>`
    + `<li><b>Customers.</b> ${file("api-examples/usage_search.py")} searches public GitHub code and keeps every call it finds, in ${file("dashboard/api-examples/usage.json")}.</li>`
    + `<li><b>Rules.</b> A person writes ${file("dashboard/api-examples/expectations.json")}, like "a wrapping key takes no text".</li>`
    + `<li><b>Proposals.</b> The api-signature-proposals skill, an AI agent, writes new signatures. ${file(t + "check_proposals.py")} compiles them the same way as step 3. You open the result with Load proposals.</li></ol>`
    + `<h3>When the library changes</h3><p class="sub">Add a keyring or a setter, then run steps 1 and 3 again. The new one shows up with every type. `
    + `<a href="${ciLink()}" target="_blank">CI</a> runs step 3 again on the pinned Rust commit, and fails if the result changed.</p>`;
}

function draw() {
  $("apis").innerHTML = data.apis.map((a, i) => (i === 0 || a.group !== data.apis[i - 1].group ? `<span class="grp">${esc(a.group || "")}</span>` : "")
    + `<button data-api="${i}" class="${i === api ? "on" : ""}">${esc(a.name)}</button>`).join("");
  const options = data.apis[api].options.filter(hasProposal);
  const allOn = options.length > 0 && options.every(k => proposed.has(k));
  const toggle = proposals ? `<button class="tool${allOn ? " on" : ""}" data-all-proposals${options.length ? "" : " disabled"}>`
    + `${allOn ? "Hide" : "Show"} proposed signatures</button>` : "";
  $("langs").innerHTML = LANGS.map(([n, l]) => `<button data-lang="${l}" class="${l === lang ? "on" : ""}">${n}</button>`).join("")
    + `<button data-lang="compare" class="${lang === "compare" ? "on" : ""}">Compare languages</button>`
    + toggle + `<label class="tool">Load proposals… <input type="file" id="load" accept=".json"></label>`;
  $("view").innerHTML = lang === "compare" ? compareView() : mapView();
}

function reset() {
  $("detail").innerHTML = "";
  $("main").classList.remove("open");
}

function foot() {
  const parts = [data.note, data.others_note];
  if (usage) parts.push(`Customers: GitHub code search on ${usage.generated_at}, ${Object.values(usage.languages).reduce((n, l) => n + l.calls, 0)} calls. `
    + `Skipped: ${usage.search ? usage.search.skipped.join("; ") : "AWS repos and forks"}. ${usage.search ? usage.search.sources : ""}`);
  if (proposals) parts.push(proposals.checked);
  $("foot").textContent = parts.filter(Boolean).join(" ");
  $("run").textContent = data.rust_commit ? `Rust ${data.rust_commit.slice(0, 7)} · rustc ${data.rustc}` : "";
}

$("apis").addEventListener("click", e => {
  const button = e.target.closest("button");
  if (!button) return;
  api = Number(button.dataset.api);
  reset();
  draw();
});
$("langs").addEventListener("click", e => {
  const button = e.target.closest("button");
  if (!button) return;
  if ("allProposals" in button.dataset) {
    const options = data.apis[api].options.filter(hasProposal);
    const allOn = options.every(k => proposed.has(k));
    for (const k of options) allOn ? proposed.delete(k) : proposed.add(k);
    reset();
    draw();
    return;
  }
  lang = button.dataset.lang;
  reset();
  draw();
});
$("langs").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (file) file.text().then(text => useProposals(JSON.parse(text)));
});
$("how").addEventListener("click", () => {
  $("detail").innerHTML = howItsMade();
  $("main").classList.add("open");
});
$("detail").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) e.target.open ? openDetails.add(id) : openDetails.delete(id);
}, true);
$("detail").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) {
    for (const s of document.querySelectorAll(".chip.sel, .cust.sel")) s.classList.remove("sel");
    reset();
  }
});
$("view").addEventListener("click", e => {
  const prop = e.target.closest(".prop");
  if (prop) {
    proposed.has(prop.dataset.prop) ? proposed.delete(prop.dataset.prop) : proposed.add(prop.dataset.prop);
    reset();
    draw();
    return;
  }
  const cust = e.target.closest(".cust");
  if (cust) {
    for (const s of document.querySelectorAll(".chip.sel, .cust.sel")) s.classList.remove("sel");
    cust.classList.add("sel");
    const [key, kind] = cust.dataset.cust.split("|");
    showCustomers(key, kind);
    return;
  }
  const c = e.target.closest(".chip");
  if (c && c.dataset.key) {
    // Mark the picked chip without redrawing, so open rows stay open.
    for (const s of document.querySelectorAll(".chip.sel, .cust.sel")) s.classList.remove("sel");
    c.classList.add("sel");
    show(c.dataset.key, c.dataset.lang, c.dataset.type);
    return;
  }
  const row = e.target.closest("tr[data-open]");
  if (row && !e.target.closest("details")) {
    const id = row.dataset.open;
    opened.has(id) ? opened.delete(id) : opened.add(id);
    draw();
  }
});
$("view").addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) e.target.open ? openDetails.add(id) : openDetails.delete(id);
}, true);

// Drag the divider to resize the two panes, the same way the test server page does. Double-click resets it.
(() => {
  const main = $("main"), div = $("divider");
  const set = px => main.style.setProperty("--left", px ? px + "px" : "1.4fr");
  set(+localStorage.getItem("typesLeftPane") || 0);
  div.addEventListener("mousedown", e => {
    e.preventDefault(); div.classList.add("drag"); document.body.classList.add("resizing");
    const move = ev => {
      const px = Math.min(Math.max(ev.clientX - main.getBoundingClientRect().left, 320), main.clientWidth - 280);
      set(px); localStorage.setItem("typesLeftPane", Math.round(px));
    };
    const up = () => { div.classList.remove("drag"); document.body.classList.remove("resizing");
      removeEventListener("mousemove", move); removeEventListener("mouseup", up); };
    addEventListener("mousemove", move); addEventListener("mouseup", up);
  });
  div.addEventListener("dblclick", () => { localStorage.removeItem("typesLeftPane"); set(0); });
})();

function useProposals(found) {
  proposals = found;
  proposed.clear();
  reset();
  draw();
  foot();
}

const json = name => fetch(name).then(r => (r.ok ? r.json() : null)).catch(() => null);
Promise.all([json("types.json"), json("usage.json"), json("expectations.json")]).then(([d, u, x]) => {
  if (!d) {
    $("view").textContent = "Could not load types.json.";
    return;
  }
  data = d;
  usage = u;
  if (x) expectations = x;
  useProposals(null);
  // proposals.json is only here when someone ran the skill and check_proposals.py in this checkout.
  json("proposals.json").then(p => { if (p) useProposals(p); });
});
</script>
</body>
</html>
