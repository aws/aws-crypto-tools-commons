<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What each option takes</title>
<style>
  body { font-family: system-ui, sans-serif; font-size: 13px; color: #1f2328; margin: 16px 20px; }
  h1 { font-size: 18px; margin: 0 0 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .bar button { border: 1px solid #d0d7de; background: #fff; border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: #1f2328; }
  .bar button.on { background: #0969da; border-color: #0969da; color: #fff; }
  .bar .gap { width: 12px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 10px; }
  th, td { border: 1px solid #e1e4e8; padding: 5px 6px; vertical-align: top; text-align: left; }
  th { background: #f6f8fa; font-size: 12px; }
  td.opt { white-space: nowrap; width: 1%; }
  td.opt b { font-family: ui-monospace, monospace; font-size: 12px; }
  td.opt div { color: #57606a; font-family: ui-monospace, monospace; font-size: 11px; }
  td.none { color: #8c959f; font-style: italic; }
  .chip { display: inline-block; margin: 2px; padding: 1px 7px; border-radius: 10px; font-family: ui-monospace, monospace; font-size: 11px; cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
  .b0 { background: #dafbe1; color: #116329; }
  .b1 { background: #f0fbf3; color: #1a7f37; border-color: #aceebb; }
  .b2 { background: #fff8c5; color: #7d4e00; }
  .b4 { background: #ffe8d6; color: #953800; }
  .bx { background: #f6f8fa; color: #57606a; border-color: #d0d7de; }
  .warn { border-color: #cf222e; color: #a40e26; }
  .sel { outline: 2px solid #0969da; }
  td.ck { text-align: center; }
  td.ck small { display: block; color: #57606a; font-family: ui-monospace, monospace; font-size: 10px; }
  .ev { font-size: 11px; color: #57606a; }
  pre { background: #0d1117; color: #e6edf3; padding: 8px 10px; border-radius: 6px; margin: 4px 0 0; font-size: 12px; white-space: pre-wrap; }
  .foot { color: #57606a; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<h1>What each option takes</h1>
<div class="bar" id="apis"></div>
<div class="bar" id="langs"></div>
<div class="bar"><span class="chip b0">as is</span><span class="chip b1">+ &amp; or Some</span><span class="chip b2">one call</span><span class="chip b4">real work</span><span class="chip bx">no fix found</span><span class="chip warn">⚠ works, risky</span></div>
<div id="view"></div>
<pre id="code">Click any type to see its code.</pre>
<div class="foot" id="foot"></div>
<script>
// types.json holds, for each option, each type a customer may hold and the shortest call that takes it.
// Rust rows come from a compiler run: rust_types.py picks the types from real crates, compile_rust_types.py tries them.
// Other languages' rows come from other_languages.py, written from each release's signatures and not compiled.
// A row is [type, cost, code, kind]. The cost is null when no fix works.
const LANGS = [["Rust", "rust"], ["Java", "java"], ["Python", "python"], [".NET", "dotnet"], ["Go", "go"], ["JS", "javascript"]];
const KINDS = ["bytes", "text", "pairs", "base64 text", "file / stream", "map", "list", "number", "Duration", "the type itself", "what builds it"];
// Rust kinds under the comparison's rows. Optional values have no row, because the other languages take null instead.
const RUST_KIND = { bytes: "bytes", text: "text", pair: "pairs", path: "file / stream", reader: "file / stream",
  stream: "file / stream", number: "number", duration: "Duration", list: "list", map: "map",
  named: "the type itself", ctor: "what builds it" };
const LEVEL = { 0: "as is", 1: "+ & or Some", 2: "one call", 4: "real work", x: "no fix found" };
let data = null, api = 0, lang = "rust", picked = "";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

// Cost 0 passes the value as is, 1 adds & or Some, 2 or 3 adds one call, 4 or more is real work.
const level = cost => cost === null ? "x" : cost === 0 ? 0 : cost === 1 ? 1 : cost <= 3 ? 2 : 4;

const rowsOf = (key, l) => (l === "rust" ? data.rust[key] : ((data.others || {})[key] || {})[l]) || [];
const kindOf = (row, l) => l === "rust" ? RUST_KIND[row[3]] : row[3];
const takesOf = (key, l) => l === "rust" ? data.takes[key] : ((data.shipped[key] || {})[l] || []).join(", ");

// Calls that work but are likely mistakes.
function risk(key, row) {
  if (row[1] === null) return "";
  if (key === "mpl/RawAesKeyring.wrapping_key" && (row[3] === "text" || row[3] === "optional text")) return "Text becomes the key bytes.";
  if (row[0] === "char" && row[1] === 0) return "A single char compiles.";
  return "";
}

function chip(key, l, row, text) {
  const warn = risk(key, row);
  const id = [key, l, row[0]].join("|");
  return `<span class="chip b${level(row[1])}${warn ? " warn" : ""}${picked === id ? " sel" : ""}" data-key="${esc(key)}" data-lang="${l}" data-type="${esc(row[0])}">${esc(text)}${warn ? " ⚠" : ""}</span>`;
}

function mapView() {
  const levels = [0, 1, 2, 4, "x"];
  let html = "<table><tr><th>Option · takes</th>" + levels.map(l => `<th>${esc(LEVEL[l][0].toUpperCase() + LEVEL[l].slice(1))}</th>`).join("") + "</tr>";
  for (const key of data.apis[api].options) {
    const takes = takesOf(key, lang);
    html += `<tr><td class="opt"><b>${esc(key.split(".")[1])}</b><div>${esc(takes || "not offered")}</div></td>`;
    if (!takes) {
      html += `<td class="none" colspan="${levels.length}">Not offered</td></tr>`;
      continue;
    }
    const cells = { 0: "", 1: "", 2: "", 4: "", x: "" };
    for (const row of rowsOf(key, lang)) cells[level(row[1])] += chip(key, lang, row, row[0]);
    html += levels.map(l => `<td>${cells[l]}</td>`).join("") + "</tr>";
  }
  return html + "</table>";
}

// The cheaper of two rows. A row with no fix found loses.
const cheaper = (a, b) => !b || (a[1] !== null && (b[1] === null || a[1] < b[1]));

function compareView() {
  let html = "";
  for (const key of data.apis[api].options) {
    const best = {};
    for (const [, l] of LANGS) {
      for (const row of rowsOf(key, l)) {
        const kind = kindOf(row, l);
        if (!kind) continue;
        best[kind] = best[kind] || {};
        if (cheaper(row, best[kind][l])) best[kind][l] = row;
      }
    }
    const customers = data.customers[key] || {};
    html += `<table><tr><th>${esc(key.split(".")[1])}</th>` + LANGS.map(l => `<th>${l[0]}</th>`).join("") + "<th>Customers convert</th></tr>";
    for (const kind of KINDS.filter(k => best[k] || customers[k])) {
      html += `<tr><td>${esc(kind)}</td>`;
      for (const [, l] of LANGS) {
        const row = (best[kind] || {})[l];
        const none = takesOf(key, l) ? "" : "not offered";
        html += `<td class="ck">${row ? chip(key, l, row, LEVEL[level(row[1])]) + `<small>${esc(row[0])}</small>` : `<small>${none}</small>`}</td>`;
      }
      html += `<td class="ev">${esc(customers[kind] || "")}</td></tr>`;
    }
    html += "</table>";
  }
  return html;
}

function show(key, l, type) {
  const row = rowsOf(key, l).find(r => r[0] === type);
  const name = LANGS.find(x => x[1] === l)[0];
  // A pair row stands for two values: x and y in Rust, k and v in the other languages.
  const pair = row[3] === "pair" || row[3] === "pairs";
  const held = pair ? `${l === "rust" ? "x, y" : "k, v"}: ${type.slice(1, -1).split(", ")[0]}` : `x: ${type}`;
  if (row[1] === null) {
    $("code").textContent = `// ${name}, ${held}\n// No fix in the list works.`;
    return;
  }
  const warn = risk(key, row);
  const code = l === "rust" ? data.apis[api].call + row[2] : row[2];
  const proof = l === "rust" ? "// ✅ compiled" : "// ⚙ written from the release's signature, not compiled";
  $("code").textContent = `// ${name}, ${held}\n${code}\n${proof}` + (warn ? `\n// ⚠ ${warn}` : "");
}

function draw() {
  $("apis").innerHTML = data.apis.map((a, i) => `<button data-api="${i}" class="${i === api ? "on" : ""}">${esc(a.name)}</button>`).join("");
  $("langs").innerHTML = LANGS.map(([n, l]) => `<button data-lang="${l}" class="${l === lang ? "on" : ""}">${n}</button>`).join("")
    + `<span class="gap"></span><button data-lang="compare" class="${lang === "compare" ? "on" : ""}">Compare languages</button>`;
  $("view").innerHTML = lang === "compare" ? compareView() : mapView();
}

function reset() {
  picked = "";
  $("code").textContent = "Click any type to see its code.";
}

$("apis").addEventListener("click", e => {
  const button = e.target.closest("button");
  if (!button) return;
  api = Number(button.dataset.api);
  reset();
  draw();
});
$("langs").addEventListener("click", e => {
  const button = e.target.closest("button");
  if (!button) return;
  lang = button.dataset.lang;
  reset();
  draw();
});
$("view").addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (!c || !c.dataset.key) return;
  picked = [c.dataset.key, c.dataset.lang, c.dataset.type].join("|");
  draw();
  show(c.dataset.key, c.dataset.lang, c.dataset.type);
});

fetch("types.json")
  .then(r => r.json())
  .then(d => { data = d; $("foot").textContent = [d.note, d.others_note].filter(Boolean).join(" "); draw(); })
  .catch(e => { $("view").textContent = "Could not load types.json: " + e; });
</script>
</body>
</html>
