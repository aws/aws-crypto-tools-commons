<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>API Examples</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8b93a7;
    --pass:#2ea043; --part:#d29922; --fail:#da3633; --sel:#388bfd; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--sel); }
  header { display:flex; gap:16px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  input[type=text] { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  main { display:grid; grid-template-columns:260px minmax(0,1fr); height:calc(100vh - 52px); }
  nav, section { overflow:auto; }
  nav { border-right:1px solid var(--line); background:var(--panel); padding:10px 0; }
  nav h2 { font-size:13px; margin:12px 16px 4px; }
  nav h3 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:8px 16px 2px; font-weight:600; }
  nav a { display:flex; justify-content:space-between; gap:8px; padding:3px 16px 3px 24px; color:var(--text); text-decoration:none; cursor:pointer; font-size:13px; }
  nav a:hover { background:var(--bg); } nav a.on { background:var(--bg); color:var(--sel); }
  nav a small { color:#ffa198; font-size:11px; }
  section { padding:16px 20px; }
  h2.api { font-size:16px; margin:0 0 2px; } .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .sources { font-size:12px; color:var(--dim); margin:0 0 12px; display:flex; flex-direction:column; gap:2px; }
  .sources b { color:var(--text); font-weight:500; } .warn { color:#e3b341; } .bad { color:#ffa198; }
  .grid { border-collapse:collapse; width:100%; table-layout:fixed; }
  .grid th, .grid td { border:1px solid var(--line); padding:6px 10px; vertical-align:top; }
  .grid thead th { position:sticky; top:-16px; background:var(--bg); z-index:1; font-size:12px; text-align:left; }
  .grid col.have { width:200px; }
  .grid tbody th { text-align:left; font-weight:400; padding-left:24px; }
  .grid tr.opt th { padding:12px 10px 4px; font-weight:600; background:var(--panel); }
  .grid tr.opt th code { color:var(--dim); font-weight:400; margin-left:8px; font-size:11px; }
  .grid tr.opt .gap { display:block; color:#ffa198; font-weight:400; font-size:12px; margin-top:2px; }
  .badge { font-size:10px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--dim); margin-left:8px; font-weight:400; }
  .badge.required { color:#ffa198; border-color:var(--fail); } .badge.optional { color:#56d364; border-color:var(--pass); }
  .snip { margin:0 0 8px; }
  .snip .meta { font-size:11px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; margin-bottom:3px; }
  .snip .meta .fails { color:#ffa198; }
  .proof { font-size:11px; color:var(--dim); display:flex; gap:8px; flex-wrap:wrap; }
  .proof code { color:var(--text); }
  pre { margin:0; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; overflow:auto; font:12px/1.45 ui-monospace,monospace; }
  .na, .nd { color:var(--dim); font-size:12px; }
  .empty { color:var(--dim); padding:20px 0; }
  details.problems { font-size:12px; margin:0 0 12px; } details.problems summary { cursor:pointer; color:#ffa198; }
  details.problems li { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>API Examples</h1>
  <label title="Read each repo's api-examples artifacts from this branch instead of its default branch.">Branch <input type="text" id="branch" size="28" placeholder="each repo's default branch"></label>
</header>
<main>
  <nav id="nav"></nav>
  <section id="main"></section>
</main>
<script src="../test-servers/loader.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = escHtml;

// Each language repo's CI uploads api-examples-<library>-<language>
// (.github/workflows/api-examples.yml). A new language is one more line here.
const SOURCES = [
  { repo:"aws/aws-crypto-tools-rust", language:"rust" },
  { repo:"aws/aws-crypto-tools-java", language:"java" },
];
const LIBRARIES = { MPL:"mpl", ESDK:"esdk" };
const GROUPS = ["Keyrings", "CMMs", "Client"];
const LANGS = SOURCES.map(s => s.language);

// docs["mpl|rust"] = { state, why, doc, art }
const docs = {};
const state = { lib:"MPL", api:null };

// ---------- loading ----------
async function entryText(zip, e) {
  let text = "";
  const reader = entryStream(zip, e).getReader();
  for (;;) { const { value, done } = await reader.read(); if (done) return text; text += value; }
}

// The newest unexpired artifact of one name from one branch, reading up to
// 500 of the newest artifacts of that name.
async function findArtifact(repo, name, branch) {
  for (let page = 1; page <= 5; page++) {
    const arts = (await ghJson(`repos/${repo}/actions/artifacts?name=${name}&per_page=100&page=${page}`)).artifacts;
    const hit = arts.filter(a => !a.expired && a.workflow_run && a.workflow_run.head_branch === branch)
      .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
    if (hit || arts.length < 100) return hit || null;
  }
  return null;
}

const defaultBranch = {};
async function load(src, lib) {
  const key = `${lib}|${src.language}`, name = `api-examples-${lib}-${src.language}`;
  const d = docs[key] = { state:"loading" };
  try {
    const branch = $("branch").value.trim()
      || (defaultBranch[src.repo] ??= (await ghJson(`repos/${src.repo}`)).default_branch);
    const art = await findArtifact(src.repo, name, branch);
    if (!art) { d.state = "none"; d.why = `no ${name} artifact from ${branch} in ${src.repo}`; return; }
    const cacheKey = `apiex3:${src.repo}:${art.id}`;
    let doc = await cacheGet(cacheKey);
    if (!doc) {
      const zip = await (await gh(`repos/${src.repo}/actions/artifacts/${art.id}/zip`)).arrayBuffer();
      const e = zipEntries(zip).find(x => x.name.endsWith("api-examples.json"));
      if (!e) throw new Error("the artifact has no api-examples.json");
      doc = JSON.parse(await entryText(zip, e));
      await cachePut(cacheKey, doc);
    }
    if (doc.schema !== 3) { d.state = "error"; d.why = `${name} has schema ${doc.schema}; rerun that repo's CI to get schema 3`; return; }
    // The run that wrote the file ran the snippet tests first, so its link is the proof that they compile and pass.
    if (!doc.run) { d.state = "error"; d.why = `${name} names no CI run, so nothing shows its snippets compile`; return; }
    Object.assign(d, { state:"done", doc, branch });
  } catch (err) {
    d.state = "error"; d.why = "could not load: " + (err.message || err);
  } finally { draw(); }
}

function loadAll() {
  for (const k of Object.keys(docs)) delete docs[k];
  for (const lib of Object.values(LIBRARIES)) for (const src of SOURCES) load(src, lib);
  draw();
}

// ---------- model ----------
const loaded = (lib, lang) => docs[`${lib}|${lang}`]?.state === "done";

// Every API of one library, merged across languages by api id.
function apisOf(lib) {
  const apis = new Map();
  for (const lang of LANGS) {
    if (!loaded(lib, lang)) continue;
    for (const api of docs[`${lib}|${lang}`].doc.apis) {
      const a = apis.get(api.id) || { id:api.id, group:api.group, name:api.name, byLang:{} };
      a.byLang[lang] = api;
      apis.set(api.id, a);
    }
  }
  return [...apis.values()];
}

// An API's option groups, in the order that api-examples.json lists its rows:
// Construct, then the Smithy operations and members, then extras. Each
// language's ways go in the group that their "row" field names, so Rust x and
// set_x and every Java overload of x share one group. A group has one line per
// "have" (what the customer starts from), in the order that the languages list
// them, so the same starting point lines up across languages.
function groupsOf(api) {
  const groups = new Map();
  for (const lang of LANGS) {
    const a = api.byLang[lang];
    if (!a) continue;
    for (const r of a.rows) {
      const g = groups.get(r.key) || groups.set(r.key, { ...r, haves:[], byLang:{} }).get(r.key);
      for (const h of r.haves) if (!g.haves.includes(h)) g.haves.push(h);
    }
    for (const w of a.ways) groups.get(w.row).byLang[lang] = [...(groups.get(w.row).byLang[lang] || []), w];
  }
  return [...groups.values()];
}

// One language's snippets for one have line, or why there are none.
function cellOf(lib, group, have, lang) {
  if (!loaded(lib, lang)) return { st:"nd" };
  const shown = (group.byLang[lang] || []).flatMap(w => w.examples.filter(e => e.have === have).map(e => ({ way:w, e })));
  return shown.length ? { st:"ex", shown } : { st:"na" };
}

// "branchKeyId" -> "Branch key ID".
const UPPER = new Set(["id", "kms", "aes", "rsa", "ecdh", "cmm", "ttl", "ddb", "arn"]);
function describe(group) {
  if (group.kind !== "member" && group.kind !== "extra") return group.label;
  const words = group.label.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/_/g, " ").toLowerCase().split(/\s+/)
    .map(w => UPPER.has(w) ? w.toUpperCase() : w);
  return words.join(" ").replace(/^./, c => c.toUpperCase());
}

function badge(group) {
  if (group.kind === "extra") return `<span class="badge" title="not in the Smithy model">extra in ${esc(LANGS.filter(l => group.byLang[l]).join(", "))}</span>`;
  const req = LANGS.flatMap(l => (group.byLang[l] || []).filter(w => w.kind === "setter").map(w => [l, w.required]));
  if (!req.length) return "";
  const vals = new Set(req.map(r => r[1]));
  if (vals.size === 1 && vals.has(true)) return `<span class="badge required">required</span>`;
  if (vals.size === 1 && vals.has(false)) return `<span class="badge optional">optional</span>`;
  const by = v => [...new Set(req.filter(r => r[1] === v).map(r => r[0]))].join(", ");
  const parts = [[true, "required"], [false, "optional"], [undefined, "unknown"]].filter(([v]) => vals.has(v)).map(([v, n]) => `${n} in ${by(v)}`);
  return `<span class="badge">${esc(parts.join("; "))}</span>`;
}

// Problems in one language's file that belong on an API's page. Marker problems
// with no api are listed on every page.
const problemsOf = (lib, lang, apiId) => loaded(lib, lang)
  ? docs[`${lib}|${lang}`].doc.uncovered.filter(f => !f.api || !apiId || f.api === apiId) : [];

// ---------- drawing ----------
function drawNav() {
  let html = "";
  for (const [label, lib] of Object.entries(LIBRARIES)) {
    html += `<h2>${label}</h2>`;
    const apis = apisOf(lib);
    const groups = [...GROUPS, ...new Set(apis.map(a => a.group).filter(g => !GROUPS.includes(g)))];
    for (const g of groups) {
      const inGroup = apis.filter(a => a.group === g).sort((a, b) => a.name.localeCompare(b.name));
      if (!inGroup.length) continue;
      html += `<h3>${esc(g)}</h3>`;
      for (const a of inGroup) {
        const n = LANGS.reduce((sum, l) => sum + problemsOf(lib, l, a.id).filter(f => f.api).length, 0);
        const on = state.lib === label && state.api === a.id;
        html += `<a class="${on ? "on" : ""}" data-lib="${label}" data-api="${esc(a.id)}">${esc(a.name)}${n ? `<small title="ways with no snippet, and marker problems">${n}</small>` : ""}</a>`;
      }
    }
    if (!apis.length) html += `<div class="sub" style="margin:0 24px">no APIs loaded</div>`;
  }
  $("nav").innerHTML = html;
}

const runUrl = doc => `https://github.com/${doc.repo}/actions/runs/${doc.run.id}/attempts/${doc.run.attempt}`;

function sourcesLine(lib) {
  return `<div class="sources">` + SOURCES.map(src => {
    const d = docs[`${lib}|${src.language}`] || { state:"loading" };
    if (d.state === "loading") return `<div><b>${src.language}</b> loading...</div>`;
    if (d.state !== "done") return `<div><b>${src.language}</b> <span class="${d.state === "error" ? "bad" : "warn"}">${esc(d.why)}</span></div>`;
    const n = d.doc.uncovered.length, problems = n ? ` · <span class="bad">${n} problems</span>` : "";
    return `<div><b>${src.language}</b> <a href="${runUrl(d.doc)}" target="_blank">${esc(src.repo.split("/")[1])}@${esc(d.branch)} · ${d.doc.commit.slice(0, 7)}</a>${problems}</div>`;
  }).join("") + `</div>`;
}

function problemList(lib, apiId) {
  const items = LANGS.flatMap(lang => problemsOf(lib, lang, apiId).map(f => {
    const doc = docs[`${lib}|${lang}`].doc;
    return `<li>${lang}: ${esc(f.api ? f.api + " " + f.way + ": " : "")}${esc(f.why)}${f.file ? ` (${link(doc, f.file, f.line)})` : ""}</li>`;
  }));
  return items.length ? `<details class="problems"><summary>${items.length} problems</summary><ul>${items.join("")}</ul></details>` : "";
}

function link(doc, file, line, lines = 1, text = `${file}:${line}`) {
  const end = lines > 1 ? `-L${line + lines - 1}` : "";
  return `<a href="https://github.com/${doc.repo}/blob/${doc.commit}/${esc(file)}#L${line}${end}" target="_blank" title="${esc(file)}:${line}">${esc(text)}</a>`;
}

const FAILS = { missing:"fails without it", reject:"rejected" };

function cellHtml(lib, lang, cell) {
  const d = docs[`${lib}|${lang}`];
  if (cell.st === "nd") return `<span class="nd">${esc(d?.why || "loading")}</span>`;
  if (cell.st === "na") return `<span class="na">not offered</span>`;
  const doc = d.doc;
  return cell.shown.map(({ way, e }) => `<div class="snip">
      <div class="meta"><code>${esc(way.id)}</code>${FAILS[e.kind] ? `<span class="fails">${FAILS[e.kind]}</span>` : ""}${link(doc, e.file, e.line, e.code.split("\n").length, "test ↗")}</div>
      <pre>${esc(e.code)}</pre></div>`).join("")
    + `<div class="proof"><a href="${runUrl(doc)}" target="_blank">✅ CI run ↗</a><code>${doc.commit.slice(0, 7)}</code></div>`;
}

// Ways that a language has in a group but no snippet shows.
function gaps(group) {
  return LANGS.flatMap(l => (group.byLang[l] || []).filter(w => !w.examples.some(e => e.kind === "pass")).map(w => `${l}: ${w.id} has no snippet`));
}

function drawMain() {
  const lib = LIBRARIES[state.lib], apis = apisOf(lib);
  const api = apis.find(a => a.id === state.api);
  let html = sourcesLine(lib);
  if (!api) {
    $("main").innerHTML = html + problemList(lib, null) + `<div class="empty">${apis.length ? "Pick an API on the left." : "No API examples loaded for " + state.lib + "."}</div>`;
    return;
  }
  const types = LANGS.filter(l => api.byLang[l]).map(l => `${l}: <code>${esc(api.byLang[l].type || "")}</code>`).join(" · ");
  html += `<h2 class="api">${esc(api.name)}</h2><div class="sub">${esc(state.lib)} · ${esc(api.group)} · ${types}</div>`;
  html += problemList(lib, api.id);
  html += `<table class="grid"><colgroup><col class="have">${LANGS.map(() => "<col>").join("")}</colgroup>`
    + `<thead><tr><th>You have...</th>${LANGS.map(l => `<th>${l}</th>`).join("")}</tr></thead><tbody>`;
  for (const group of groupsOf(api)) {
    const name = group.kind === "member" || group.kind === "extra" ? `<code>${esc(group.label)}</code>` : "";
    const gap = gaps(group).map(g => `<span class="gap">${esc(g)}</span>`).join("");
    html += `<tr class="opt"><th colspan="${LANGS.length + 1}">${esc(describe(group))}${name}${badge(group)}${gap}</th></tr>`;
    if (!group.haves.length) {
      html += `<tr><th></th>${LANGS.map(l => `<td>${cellHtml(lib, l, cellOf(lib, group, null, l))}</td>`).join("")}</tr>`;
      continue;
    }
    for (const have of group.haves) {
      html += `<tr><th>${esc(have)}</th>${LANGS.map(l => `<td>${cellHtml(lib, l, cellOf(lib, group, have, l))}</td>`).join("")}</tr>`;
    }
  }
  $("main").innerHTML = html + `</tbody></table>`;
}

function draw() {
  if (!state.api) state.api = apisOf(LIBRARIES[state.lib])[0]?.id || null;
  drawNav(); drawMain();
}

// ---------- events ----------
$("nav").addEventListener("click", e => {
  const a = e.target.closest("a[data-api]");
  if (!a) return;
  Object.assign(state, { lib:a.dataset.lib, api:a.dataset.api });
  draw();
});
$("branch").value = new URLSearchParams(location.search).get("branch") || "";
$("branch").addEventListener("change", () => {
  const q = new URLSearchParams(location.search);
  $("branch").value.trim() ? q.set("branch", $("branch").value.trim()) : q.delete("branch");
  history.replaceState(null, "", "?" + q);
  loadAll();
});
loadAll();
</script>
</body>
</html>
