<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>API Examples</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8b93a7;
    --pass:#2ea043; --part:#d29922; --fail:#da3633; --sel:#388bfd; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  a { color:var(--sel); }
  header { display:flex; gap:16px; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  input[type=text], select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  .tabs { display:flex; gap:4px; } .tabs button { background:var(--bg); color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:4px 12px; cursor:pointer; font:inherit; }
  .tabs button.on { color:var(--text); border-color:var(--sel); }
  main { display:grid; grid-template-columns:260px minmax(0,1fr); height:calc(100vh - 52px); }
  nav, section { overflow:auto; }
  nav { border-right:1px solid var(--line); background:var(--panel); padding:10px 0; }
  nav h2 { font-size:13px; margin:12px 16px 4px; }
  nav h3 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:8px 16px 2px; font-weight:600; }
  nav a { display:flex; justify-content:space-between; gap:8px; padding:3px 16px 3px 24px; color:var(--text); text-decoration:none; cursor:pointer; font-size:13px; }
  nav a:hover { background:var(--bg); } nav a.on { background:var(--bg); color:var(--sel); }
  nav a small { color:#ffa198; font-size:11px; }
  section { padding:16px 20px; }
  h2.api { font-size:16px; margin:0 0 2px; } .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .sources { font-size:12px; color:var(--dim); margin:0 0 12px; display:flex; flex-direction:column; gap:2px; }
  .sources b { color:var(--text); font-weight:500; } .warn { color:#e3b341; } .bad { color:#ffa198; }
  .play { display:grid; grid-template-columns:minmax(320px, 1fr) minmax(360px, 1.2fr); gap:16px; align-items:start; }
  .cards { display:flex; flex-direction:column; gap:8px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel); }
  .card.removed { opacity:.6; }
  .card .head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px; }
  .card .head code { color:var(--dim); font-size:11px; }
  .card select { width:100%; }
  .card .st { font-size:12px; margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; }
  .st.ok, .st.fails { color:#56d364; } .st.untested { color:#e3b341; } .st.absent, .st.none { color:var(--dim); } .st.shipped { color:#79c0ff; }
  .card .alt { font-size:11px; color:var(--dim); margin-top:3px; } .card .alt code { color:var(--text); }
  .card button { margin-top:6px; background:var(--bg); color:var(--sel); border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; font:inherit; font-size:12px; }
  .badge { font-size:10px; padding:0 6px; border-radius:8px; border:1px solid var(--line); color:var(--dim); font-weight:400; }
  .badge.required { color:#ffa198; border-color:var(--fail); } .badge.optional { color:#56d364; border-color:var(--pass); }
  .tag { font-size:10px; padding:0 6px; border-radius:8px; font-weight:600; }
  .tag.new { background:#1f6feb; color:#fff; } .tag.removed { background:#6e7681; color:#fff; } .tag.changed { background:#9e6a03; color:#fff; }
  .side { position:sticky; top:0; display:flex; flex-direction:column; gap:10px; }
  pre { margin:0; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; overflow:auto; font:12px/1.45 ui-monospace,monospace; }
  .verdict { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--panel); font-size:13px; }
  .verdict.ok, .verdict.fails { border-color:var(--pass); } .verdict.untested { border-color:var(--part); } .verdict.shipped { border-color:#1f6feb; }
  .verdict .why { font-weight:600; } .verdict ul { margin:4px 0 0; padding-left:18px; font-size:12px; color:var(--dim); }
  .verdict .ci { font-size:12px; margin-top:4px; }
  .others h4 { margin:4px 0; font-size:12px; color:var(--dim); font-weight:600; }
  .others .meta { font-size:11px; color:var(--dim); display:flex; gap:8px; margin:6px 0 3px; }
  .empty { color:var(--dim); padding:20px 0; }
  details.problems { font-size:12px; margin:0 0 12px; } details.problems summary { cursor:pointer; color:#ffa198; }
  details.problems li { color:var(--dim); }
  #all { background:var(--bg); color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:4px 12px; cursor:pointer; font:inherit; }
  #all.on { color:var(--text); border-color:var(--sel); }
  table.matrix { border-collapse:collapse; font-size:12px; margin-top:6px; }
  table.matrix th, table.matrix td { border:1px solid var(--line); padding:2px 8px; text-align:center; }
  table.matrix th { color:var(--dim); font-weight:600; }
  table.matrix td.have { text-align:left; color:var(--text); }
  table.matrix tr.opt th { text-align:left; color:var(--text); background:var(--panel); padding-top:6px; }
  table.matrix td[data-lang] { cursor:pointer; } table.matrix td[data-lang]:hover { background:var(--bg); outline:1px solid var(--sel); }
  .usage h4 { margin:8px 0 2px; font-size:12px; font-weight:600; } .usage h4 span, .usage .from, .usage .langs { color:var(--dim); font-weight:400; font-size:11px; }
  .usage ol { margin:0; padding-left:20px; font-size:12px; } .tag.candidate { background:#8957e5; color:#fff; }
</style>
</head>
<body>
<header>
  <h1>API Examples</h1>
  <label title="A branch name reads every repo's api-examples artifacts from that branch. owner/repo#number reads that pull request's artifacts. Either one is compared with the default branch.">Branch or PR <input type="text" id="branch" size="32" placeholder="each repo's default branch"></label>
  <div class="tabs" id="tabs"></div>
  <button id="all" title="Every option of this API in every language">All options</button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="main"></section>
</main>
<script src="../test-servers/loader.js"></script>
<script src="playground.js"></script>
<script src="usage.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = escHtml;
const P = window.Playground;

// Each language repo's CI uploads api-examples-<library>-<language>
// (.github/workflows/api-examples.yml). A new language is one more line here.
const SOURCES = [
  { repo:"aws/aws-crypto-tools-rust", language:"rust" },
  { repo:"aws/aws-crypto-tools-java", language:"java" },
];
// The libraries as they ship today. Commons' api-examples-shipped.yml reads each
// released package daily and uploads api-examples-<library>-<language>-shipped.
const SHIPPED = ["java", "python", "dotnet", "go", "javascript"].map(language =>
  ({ repo:"aws/aws-crypto-tools-commons", language, key:`${language}-shipped`, shipped:true }));
const LIBRARIES = { MPL:"mpl", ESDK:"esdk" };
const GROUPS = ["Keyrings", "CMMs", "Client"];
const LANGS = [...SOURCES.map(s => s.language), ...SHIPPED.map(s => s.key)];

// docs["mpl|rust"] = { state, why, doc, base, branch, art }
// base is the default branch's file, when the page compares a branch or PR with it.
const docs = {};
// picks["MPL|raw-aes-keyring"] = { option row: have, or null to leave it out }
// compare holds "MPL|raw-aes-keyring|keyName" for each card whose language matrix is open.
// all shows every option's matrix in one table instead of the cards.
const state = { lib:"MPL", api:null, lang:LANGS[0], picks:{}, compare:new Set(), all:false };

// ---------- loading ----------
async function entryText(zip, e) {
  let text = "";
  const reader = entryStream(zip, e).getReader();
  for (;;) { const { value, done } = await reader.read(); if (done) return text; text += value; }
}

// The newest unexpired artifact of one name from one branch (or from any
// branch, when branch is null), reading up to 500 of the newest artifacts of that name.
async function findArtifact(repo, name, branch) {
  for (let page = 1; page <= 5; page++) {
    const arts = (await ghJson(`repos/${repo}/actions/artifacts?name=${name}&per_page=100&page=${page}`)).artifacts;
    const hit = arts.filter(a => !a.expired && a.workflow_run && (branch === null || a.workflow_run.head_branch === branch))
      .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
    if (hit || arts.length < 100) return hit || null;
  }
  return null;
}

async function readDoc(repo, name, branch) {
  const art = await findArtifact(repo, name, branch);
  if (!art) return { why:`no ${name} artifact from ${branch} in ${repo}` };
  const cacheKey = `apiex4:${repo}:${art.id}`;
  let doc = await cacheGet(cacheKey);
  if (!doc) {
    const zip = await (await gh(`repos/${repo}/actions/artifacts/${art.id}/zip`)).arrayBuffer();
    const e = zipEntries(zip).find(x => x.name.endsWith("api-examples.json"));
    if (!e) throw new Error("the artifact has no api-examples.json");
    doc = JSON.parse(await entryText(zip, e));
    await cachePut(cacheKey, doc);
  }
  if (doc.schema !== 4) return { why:`${name} from ${branch} has schema ${doc.schema}; rerun that repo's CI to get schema 4` };
  // The run that wrote the file ran the example tests first, so its link is the proof that they compile and pass.
  if (!doc.run) return { why:`${name} from ${branch} names no CI run, so nothing shows its examples compile` };
  return { doc };
}

const defaultBranch = {};
const prHead = {};

// Which branch to read for one repo, and whether to compare it with the default branch.
async function target(src) {
  const text = $("branch").value.trim(), pr = P.parsePr(text);
  const main = defaultBranch[src.repo] ??= (await ghJson(`repos/${src.repo}`)).default_branch;
  if (pr && pr.repo === src.repo) {
    const key = `${pr.repo}#${pr.number}`;
    const head = prHead[key] ??= (await ghJson(`repos/${pr.repo}/pulls/${pr.number}`)).head.ref;
    return { branch:head, main, compare:true };
  }
  if (pr || !text) return { branch:main, main, compare:false };
  return { branch:text, main, compare:text !== main };
}

async function load(src, lib) {
  const key = `${lib}|${src.key || src.language}`, name = `api-examples-${lib}-${src.language}${src.shipped ? "-shipped" : ""}`;
  const d = docs[key] = { state:"loading" };
  try {
    // A released package is the same on every branch, so its newest file from any branch will do.
    if (src.shipped) {
      const r = await readDoc(src.repo, name, null);
      if (!r.doc) { d.state = "none"; d.why = r.why; return; }
      Object.assign(d, { state:"done", doc:r.doc, branch:null, base:null, baseWhy:null });
      return;
    }
    const t = await target(src);
    const [head, base] = await Promise.all([readDoc(src.repo, name, t.branch),
      t.compare ? readDoc(src.repo, name, t.main) : null]);
    if (!head.doc) { d.state = "none"; d.why = head.why; return; }
    Object.assign(d, { state:"done", doc:head.doc, branch:t.branch, base:base?.doc || null,
      baseWhy:t.compare && !base?.doc ? base.why : null });
  } catch (err) {
    d.state = "error"; d.why = "could not load: " + (err.message || err);
  } finally {
    // A file that loads late can bring the default choices, so start each call again.
    state.picks = {};
    draw();
  }
}

function loadAll() {
  for (const k of Object.keys(docs)) delete docs[k];
  state.picks = {};
  for (const lib of Object.values(LIBRARIES)) for (const src of [...SOURCES, ...SHIPPED]) load(src, lib);
  draw();
}

// ---------- model ----------
const loaded = (lib, lang) => docs[`${lib}|${lang}`]?.state === "done";
const docsOf = (lib, which = "doc") => Object.fromEntries(LANGS.filter(l => loaded(lib, l)).map(l => [l, docs[`${lib}|${l}`][which]]));
const comparing = lib => LANGS.some(l => loaded(lib, l) && docs[`${lib}|${l}`].base);

// The default branch's file stands in for a language that has no base file,
// so that only the branch or PR's own changes get tags.
function diffOf(lib) {
  if (!comparing(lib)) return null;
  const head = docsOf(lib), base = docsOf(lib, "base");
  for (const l of Object.keys(head)) base[l] ??= head[l];
  return P.diffApis(P.apisOf(base, LANGS), P.apisOf(head, LANGS), LANGS);
}

const problemsOf = (lib, lang, apiId) => loaded(lib, lang)
  ? docs[`${lib}|${lang}`].doc.uncovered.filter(f => !f.api || !apiId || f.api === apiId) : [];

// "branchKeyId" -> "Branch key ID".
const UPPER = new Set(["id", "kms", "aes", "rsa", "ecdh", "cmm", "ttl", "ddb", "arn"]);
function describe(label) {
  const words = label.replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/_/g, " ").toLowerCase().split(/\s+/)
    .map(w => UPPER.has(w) ? w.toUpperCase() : w);
  return words.join(" ").replace(/^./, c => c.toUpperCase());
}

const tag = t => t ? `<span class="tag ${t}">${t}</span>` : "";

// A column's name: the language, or "Java (3.x shipped)" for a shipped file once it loads.
function labelOf(lib, lang) {
  const doc = loaded(lib, lang) ? docs[`${lib}|${lang}`].doc : null;
  return doc?.shipped ? P.shippedLabel(doc) : lang;
}
const labelsOf = lib => Object.fromEntries(LANGS.map(l => [l, labelOf(lib, l)]));

// ---------- drawing ----------
function drawTabs() {
  const lib = LIBRARIES[state.lib];
  $("tabs").innerHTML = LANGS.map(l => `<button data-lang="${l}" class="${l === state.lang ? "on" : ""}">${esc(labelOf(lib, l))}</button>`).join("");
}

function drawNav() {
  let html = "";
  for (const [label, lib] of Object.entries(LIBRARIES)) {
    html += `<h2>${label}</h2>`;
    const diff = diffOf(lib);
    const apis = [...P.apisOf(docsOf(lib), LANGS), ...(diff?.removedApis || [])];
    const groups = [...GROUPS, ...new Set(apis.map(a => a.group).filter(g => !GROUPS.includes(g)))];
    for (const g of groups) {
      const inGroup = P.navOrder(apis.filter(a => a.group === g), diff);
      if (!inGroup.length) continue;
      html += `<h3>${esc(g)}</h3>`;
      for (const a of inGroup) {
        const n = LANGS.reduce((sum, l) => sum + problemsOf(lib, l, a.id).filter(f => f.api).length, 0);
        const on = state.lib === label && state.api === a.id;
        html += `<a class="${on ? "on" : ""}" data-lib="${label}" data-api="${esc(a.id)}"><span>${esc(a.name)} ${tag(diff?.api[a.id])}</span>${n ? `<small title="ways with no example, and marker problems">${n}</small>` : ""}</a>`;
      }
    }
    if (!apis.length) html += `<div class="sub" style="margin:0 24px">no APIs loaded</div>`;
  }
  $("nav").innerHTML = html;
}

const runUrl = doc => `https://github.com/${doc.repo}/actions/runs/${doc.run.id}/attempts/${doc.run.attempt}`;

function link(doc, file, line, text = `${file}:${line}`) {
  return `<a href="https://github.com/${doc.repo}/blob/${doc.commit}/${esc(file)}#L${line}" target="_blank" title="${esc(file)}:${line}">${esc(text)}</a>`;
}

function sourcesLine(lib) {
  return `<div class="sources">` + [...SOURCES, ...SHIPPED].map(src => {
    const key = src.key || src.language;
    const d = docs[`${lib}|${key}`] || { state:"loading" };
    if (d.state === "loading") return `<div><b>${key}</b> loading...</div>`;
    if (d.state !== "done") return `<div><b>${key}</b> <span class="${d.state === "error" ? "bad" : "warn"}">${esc(d.why)}</span></div>`;
    if (d.doc.shipped) {
      return `<div><b>${esc(P.shippedLabel(d.doc))}</b> <a href="${runUrl(d.doc)}" target="_blank">${esc(d.doc.shipped.package)} ${esc(d.doc.shipped.version)}</a></div>`;
    }
    const n = d.doc.uncovered.length, problems = n ? ` · <span class="bad">${n} problems</span>` : "";
    const base = d.base ? ` · compared with ${esc(d.base.commit.slice(0, 7))} on the default branch`
      : d.baseWhy ? ` · <span class="warn">not compared: ${esc(d.baseWhy)}</span>` : "";
    return `<div><b>${src.language}</b> <a href="${runUrl(d.doc)}" target="_blank">${esc(src.repo.split("/")[1])}@${esc(d.branch)} · ${d.doc.commit.slice(0, 7)}</a>${problems}${base}</div>`;
  }).join("") + `</div>`;
}

function problemList(lib, apiId) {
  const items = LANGS.flatMap(lang => problemsOf(lib, lang, apiId).map(f => {
    const doc = docs[`${lib}|${lang}`].doc;
    return `<li>${lang}: ${esc(f.api ? f.api + " " + (f.way || "") + ": " : "")}${esc(f.why)}${f.file ? ` (${link(doc, f.file, f.line)})` : ""}</li>`;
  }));
  return items.length ? `<details class="problems"><summary>${items.length} problems</summary><ul>${items.join("")}</ul></details>` : "";
}

function requiredBadge(option, lang) {
  const req = new Set((option.byLang[lang]?.ways || []).map(w => w.required));
  if (req.size !== 1) return "";
  if (req.has(true)) return `<span class="badge required">required in ${esc(lang)}</span>`;
  if (req.has(false)) return `<span class="badge optional">optional in ${esc(lang)}</span>`;
  return "";
}

function cardHtml(ctx, option, i) {
  const { api, lang, picks, diff, doc } = ctx;
  const have = picks[option.key] ?? null;
  const s = P.status(option, have, lang);
  const haveTag = h => diff?.have[`${api.id}|${option.key}|${h}`] === "new" ? " [new]" : "";
  const choices = [`<option value="">leave it out</option>`, ...option.haves.map((h, j) =>
    `<option value="${j}" ${h === have ? "selected" : ""}>${esc(P.choiceLabel(option, h, lang) + haveTag(h))}</option>`)];
  for (const h of diff?.removedHaves[`${api.id}|${option.key}`] || []) choices.push(`<option disabled>${esc(h)} [removed]</option>`);
  const choice = have === null ? null : P.choiceOf(option, have, lang);
  const alts = (choice?.alts || []).map(a => `<div class="alt">or: <code>${esc(a.setter.trim())}</code> ${doc ? link(doc, a.file, a.line, "test ↗") : ""}</div>`).join("");
  const where = s.where && doc ? link(doc, s.where.file, s.where.line, "test ↗")
    : s.signature ? `<code>${esc(s.signature)}</code>` : "";
  const copy = (s.kind === "untested" || s.kind === "absent") && doc?.templates?.["new-test"]
    ? `<button data-copy="${i}">Copy as a new test</button>` : "";
  const open = state.compare.has(`${ctx.pickKey}|${option.key}`);
  const matrix = open ? P.matrixHtml(api, [{ option, index:i }], ctx.langs, diff, false, [], ctx.labels) : "";
  return `<div class="card">
    <div class="head"><b>${esc(describe(option.label))}</b><code>${esc(option.label)}</code>${requiredBadge(option, lang)}${tag(diff?.option[`${api.id}|${option.key}`])}</div>
    <select data-option="${i}">${choices.join("")}</select>
    <div class="st ${s.kind}"><span>${esc(s.label)}</span>${where}</div>${alts}${copy}
    <button data-compare="${i}">${open ? "Hide languages" : "Compare languages"}</button>${matrix}
    ${Usage.sectionHtml(usage, LIBRARIES[state.lib], api.id, option, lang)}</div>`;
}

function removedCard(option) {
  return `<div class="card removed"><div class="head"><b>${esc(describe(option.label))}</b><code>${esc(option.label)}</code>${tag("removed")}</div></div>`;
}

function verdictHtml(ctx) {
  const { api, options, picks, lang, doc } = ctx;
  const v = P.verdict(api, options, picks, lang);
  if (!doc) return `<div class="verdict"><span class="why">${esc(v.text)}</span></div>`;
  if (doc.shipped) {
    return `<div class="verdict ${v.kind}"><div class="why">${esc(v.text)}</div>
      <ul><li>read from ${esc(doc.shipped.package)} ${esc(doc.shipped.version)} by <a href="${runUrl(doc)}" target="_blank">this CI run ↗</a></li></ul></div>`;
  }
  const tests = [...new Map(v.links.map(l => [`${l.file}:${l.line}`, l])).values()]
    .map(l => `<li>${link(doc, l.file, l.line)}</li>`).join("");
  const combos = api.byLang[lang]?.combos;
  const ci = v.combo
    ? (v.combo.outcome === "pass" ? `✅ this exact call compiled and ran in CI (<code>${esc(v.combo.name)}</code>)`
      : `❌ this exact call did not behave as expected in CI (<code>${esc(v.combo.name)}</code>)`)
    : combos ? `this exact call is not one of the ${combos.results.length} calls CI ran${combos.mode === "pairwise" ? ` (a pairwise sample of ${combos.total})` : ""}` : "";
  return `<div class="verdict ${v.kind}"><div class="why">${esc(v.text)}</div>
    ${ci ? `<div class="ci">${ci}</div>` : ""}
    <ul>${tests}<li><a href="${runUrl(doc)}" target="_blank">✅ CI run ↗</a> <code>${doc.commit.slice(0, 7)}</code></li></ul></div>`;
}

function othersHtml(ctx) {
  const { api, lang, doc } = ctx;
  const ex = api.byLang[lang]?.examples || [];
  if (!ex.length) return "";
  return `<div class="others"><h4>Other ways in ${esc(lang)}</h4>` + ex.map(e =>
    `<div class="meta"><code>${esc(e.way)}</code><span>${esc(e.have)}</span>${link(doc, e.file, e.line, "test ↗")}</div><pre>${esc(e.code)}</pre>`).join("") + `</div>`;
}

let ctx = null;

function drawMain() {
  const lib = LIBRARIES[state.lib], diff = diffOf(lib);
  const apis = P.apisOf(docsOf(lib), LANGS);
  const api = apis.find(a => a.id === state.api);
  let html = sourcesLine(lib);
  if (!api) {
    const gone = diff?.removedApis.find(a => a.id === state.api);
    const why = gone ? `${gone.name} is removed in this branch or PR.` : apis.length ? "Pick an API on the left." : `No API examples loaded for ${state.lib}.`;
    $("main").innerHTML = html + problemList(lib, null) + `<div class="empty">${esc(why)}</div>`;
    ctx = null;
    return;
  }
  const lang = state.lang, options = P.optionsOf(api, LANGS);
  const pickKey = `${state.lib}|${api.id}`;
  const picks = state.picks[pickKey] ??= P.startPicks(options, lang, LANGS);
  const doc = loaded(lib, lang) ? docs[`${lib}|${lang}`].doc : null;
  const langs = LANGS.filter(l => loaded(lib, l));
  ctx = { api, options, picks, pickKey, lang, langs, diff, doc, labels:labelsOf(lib) };
  const type = api.byLang[lang]?.type;
  html += `<h2 class="api">${esc(api.name)} ${tag(diff?.api[api.id])}</h2><div class="sub">${esc(state.lib)} · ${esc(api.group)}${type ? ` · <code>${esc(type)}</code>` : ""}</div>`;
  html += problemList(lib, api.id);
  if (state.all) {
    const items = options.map((option, index) => ({ option, index }));
    $("main").innerHTML = html + P.matrixHtml(api, items, langs, diff, true, diff?.removedOptions[api.id] || [], ctx.labels);
    return;
  }
  const code = P.codeOf(api, options, picks, lang);
  const removed = (diff?.removedOptions[api.id] || []).map(removedCard).join("");
  html += `<div class="play"><div class="cards">${options.map((o, i) => cardHtml(ctx, o, i)).join("")}${removed}</div>
    <div class="side"><pre>${code ? esc(code.join("\n")) : `${esc(lang)} has no ${esc(api.name)}`}</pre>${verdictHtml(ctx)}${doc && !doc.shipped ? othersHtml(ctx) : ""}</div></div>`;
  $("main").innerHTML = html;
}

function draw() {
  if (!state.api) state.api = P.navOrder(P.apisOf(docsOf(LIBRARIES[state.lib]), LANGS), diffOf(LIBRARIES[state.lib]))[0]?.id || null;
  drawTabs(); drawNav(); drawMain();
  $("all").className = state.all ? "on" : "";
}

// ---------- events ----------
$("nav").addEventListener("click", e => {
  const a = e.target.closest("a[data-api]");
  if (!a) return;
  Object.assign(state, { lib:a.dataset.lib, api:a.dataset.api });
  draw();
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]");
  if (!b) return;
  state.lang = b.dataset.lang;
  draw();
});
$("main").addEventListener("change", e => {
  const sel = e.target.closest("select[data-option]");
  if (!sel || !ctx) return;
  const option = ctx.options[Number(sel.dataset.option)];
  ctx.picks[option.key] = sel.value === "" ? null : option.haves[Number(sel.value)];
  drawMain();
});
$("all").addEventListener("click", () => {
  state.all = !state.all;
  draw();
});
$("main").addEventListener("click", e => {
  const toggle = e.target.closest("button[data-compare]");
  if (toggle && ctx) {
    const key = `${ctx.pickKey}|${ctx.options[Number(toggle.dataset.compare)].key}`;
    if (!state.compare.delete(key)) state.compare.add(key);
    drawMain();
    return;
  }
  // A cell shows that language's tab with that choice picked, in the cards.
  const cell = e.target.closest("td[data-lang]");
  if (!cell || !ctx) return;
  const next = P.pickCell(ctx.options, ctx.picks, cell.dataset);
  state.picks[ctx.pickKey] = next.picks;
  state.lang = next.lang;
  state.all = false;
  draw();
});
$("main").addEventListener("click", async e => {
  const b = e.target.closest("button[data-copy]");
  if (!b || !ctx) return;
  const option = ctx.options[Number(b.dataset.copy)];
  const text = P.newTest(ctx.api, ctx.options, option, ctx.picks[option.key] ?? null, ctx.lang);
  await navigator.clipboard.writeText(text);
  b.textContent = "Copied";
});

const query = new URLSearchParams(location.search);
$("branch").value = query.get("pr") || query.get("branch") || "";
$("branch").addEventListener("change", () => {
  const q = new URLSearchParams(location.search), text = $("branch").value.trim();
  q.delete("pr"); q.delete("branch");
  if (text) q.set(P.parsePr(text) ? "pr" : "branch", text);
  history.replaceState(null, "", "?" + q);
  state.api = null;
  loadAll();
});
let usage = null;
Usage.load({ findArtifact, gh, zipEntries, entryText }).then(u => { usage = u; draw(); });
loadAll();
</script>
</body>
</html>
